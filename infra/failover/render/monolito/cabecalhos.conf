# Cabecalhos repassados a todos os servicos internos.
# Em arquivo separado porque o nginx nao herda proxy_set_header entre blocos:
# definir no server e usar `if` dentro do location faz os cabecalhos sumirem.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Authorization     $http_authorization;
proxy_set_header apikey            $http_apikey;

# O CORS fica no gateway, e nao em cada servico, para o navegador ver sempre a
# mesma resposta. O ERP e servido de outro endereco (hoje lovable.app), entao
# toda chamada e cross-origin.
add_header Access-Control-Allow-Origin  "*" always;
add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type, prefer, range, x-worker-secret" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Expose-Headers "content-range, content-profile" always;
