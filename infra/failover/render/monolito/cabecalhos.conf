# Cabecalhos repassados a todos os servicos internos.
# Em arquivo separado porque o nginx nao herda proxy_set_header entre blocos:
# definir no server e usar `if` dentro do location faz os cabecalhos sumirem.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Authorization     $http_authorization;
proxy_set_header apikey            $http_apikey;

# O CORS fica no gateway, e nao em cada servico, para o navegador ver sempre a
# mesma resposta. O ERP e servido de outro endereco (hoje lovable.app), entao
# toda chamada e cross-origin.
#
# A LISTA DE CABECALHOS NAO E DECORATIVA: UM QUE FALTE DERRUBA O LOGIN INTEIRO
#
# Faltava x-supabase-api-version, que o supabase-js manda em TODA chamada. O
# navegador recusava o preflight e o login na replica nem saia do lugar
# (medido no navegador em 05/10/2026, no ERP de verdade):
#
#     Access to fetch at '.../auth/v1/token' has been blocked by CORS policy:
#     Request header field x-supabase-api-version is not allowed by
#     Access-Control-Allow-Headers in preflight response.
#
# Nenhum teste por curl pega isso - curl nao faz preflight. Era possivel
# conferir 152 anexos pela API com sucesso e a contingencia estar quebrada
# para gente de verdade, que foi exatamente o que aconteceu.
#
# accept-profile / content-profile: o PostgREST usa para escolher schema
# (o ERP le storage.objects assim). x-upsert: o Storage usa no envio.
add_header Access-Control-Allow-Origin  "*" always;
add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type, prefer, range, x-worker-secret, x-supabase-api-version, x-supabase-client, accept-profile, content-profile, x-upsert, cache-control, x-requested-with" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
# content-disposition importa para anexo: e dele que o navegador tira o nome
# do arquivo ao salvar.
add_header Access-Control-Expose-Headers "content-range, content-profile, content-disposition, content-length" always;
# Sem isto o navegador repete o preflight a cada chamada.
add_header Access-Control-Max-Age 86400 always;
