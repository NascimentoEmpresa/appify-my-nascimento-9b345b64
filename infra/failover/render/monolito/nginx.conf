# ============================================================================
#  Gateway da replica  (faz o papel do Kong, em 40 linhas)
# ============================================================================
#  Publica os MESMOS caminhos que a URL da Supabase - /auth/v1, /rest/v1,
#  /storage/v1 e /functions/v1 - para que trocar de backend um dia seja trocar
#  UM endereco, e nao mexer no codigo do ERP.
# ============================================================================
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    # O ERP envia anexo; o padrao de 1 MB cortaria upload sem explicar direito.
    client_max_body_size 50m;
    # Restauracao e consulta pesada podem demorar mais que o padrao de 60s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Sem apikey o Kong devolvia 401 ANTES de tocar no banco. Reproduzido aqui:
    # vale para /rest/v1 e /storage/v1. O /auth/v1 fica de fora porque a tela de
    # login chama sem sessao, e o /functions/v1 tambem - 14 das 59 funcoes sao
    # publicas de proposito (Canal de Etica, Portal do Colaborador, webhook da
    # Meta, chamadas do CI) e o navegador nem manda apikey nelas.
    map $http_apikey $sem_apikey {
        default 0;
        ""      1;
    }

    server {
        listen 8000 default_server;

        # Resposta ao preflight do navegador. Ele nunca leva Authorization,
        # entao precisa ser respondido aqui para o CORS funcionar ate nas rotas
        # que exigem token.
        location / {
            if ($request_method = OPTIONS) { return 204; }
            return 404 '{"erro":"rota desconhecida nesta replica"}';
        }

        location /auth/v1/     { proxy_pass http://127.0.0.1:9999/; include /etc/nginx/cabecalhos.conf; }
        location /functions/v1/ { proxy_pass http://127.0.0.1:9000/; include /etc/nginx/cabecalhos.conf; }

        location /rest/v1/ {
            if ($sem_apikey) { return 401 '{"message":"No API key found in request"}'; }
            proxy_pass http://127.0.0.1:3000/;
            include /etc/nginx/cabecalhos.conf;
        }

        location /storage/v1/ {
            if ($sem_apikey) { return 401 '{"message":"No API key found in request"}'; }
            proxy_pass http://127.0.0.1:5000/;
            include /etc/nginx/cabecalhos.conf;
        }

        # Para a Render saber que o servico esta vivo, E para o ERP perguntar
        # se a replica responde antes de oferecer o modo consulta.
        #
        # O CORS aqui NAO e enfeite: sem ele o navegador bloqueia a pergunta
        # que o ERP faz de outro dominio, a resposta nunca chega, e o botao
        # "Consultar em modo leitura" simplesmente nao aparece - sem erro
        # visivel, porque o bloqueio e do navegador. Descoberto em 02/10/2026
        # testando o build local: o /rest/v1/ ja tinha CORS e o /saude nao.
        #
        # Liberar * aqui nao expoe nada: a resposta e a palavra "ok", sem
        # tocar no banco.
        location = /saude {
            add_header Access-Control-Allow-Origin  * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Content-Type text/plain;
            return 200 'ok';
        }
    }
}
