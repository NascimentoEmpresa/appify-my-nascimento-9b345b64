# ============================================================================
#  Gateway da replica  (faz o papel do Kong, em 40 linhas)
# ============================================================================
#  Publica os MESMOS caminhos que a URL da Supabase - /auth/v1, /rest/v1,
#  /storage/v1 e /functions/v1 - para que trocar de backend um dia seja trocar
#  UM endereco, e nao mexer no codigo do ERP.
# ============================================================================
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    # O ERP envia anexo; o padrao de 1 MB cortaria upload sem explicar direito.
    client_max_body_size 50m;
    # Restauracao e consulta pesada podem demorar mais que o padrao de 60s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Sem apikey o Kong devolvia 401 ANTES de tocar no banco. Reproduzido aqui:
    # vale para /rest/v1 e /storage/v1. O /auth/v1 fica de fora porque a tela de
    # login chama sem sessao, e o /functions/v1 tambem - 14 das 59 funcoes sao
    # publicas de proposito (Canal de Etica, Portal do Colaborador, webhook da
    # Meta, chamadas do CI) e o navegador nem manda apikey nelas.
    map $http_apikey $sem_apikey {
        default 0;
        ""      1;
    }

    server {
        listen 8000 default_server;

        # Resposta ao preflight do navegador. Ele nunca leva Authorization,
        # entao precisa ser respondido aqui para o CORS funcionar ate nas rotas
        # que exigem token.
        location / {
            if ($request_method = OPTIONS) { return 204; }
            return 404 '{"erro":"rota desconhecida nesta replica"}';
        }

        # OPTIONS respondido no gateway tambem aqui, para o navegador ver
        # sempre a MESMA lista de cabecalhos permitidos, venha a resposta do
        # nginx ou do servico. O GoTrue responde preflight por conta propria,
        # com uma lista diferente da nossa - e divergencia entre as duas e
        # falha que aparece so no navegador.
        location /auth/v1/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://127.0.0.1:9999/;
            include /etc/nginx/cabecalhos.conf;
        }

        location /functions/v1/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://127.0.0.1:9000/;
            include /etc/nginx/cabecalhos.conf;
        }

        # O PREFLIGHT TEM QUE SER RESPONDIDO ANTES DA TRAVA DE APIKEY.
        #
        # O preflight do navegador NAO carrega apikey - por definicao, ele
        # pergunta antes de mandar cabecalho nenhum. Caindo no $sem_apikey ele
        # recebia 401, e o navegador recusava a chamada de verdade:
        #
        #     Response to preflight request doesn't pass access control check:
        #     It does not have HTTP ok status.
        #
        # O `location /` acima ja respondia OPTIONS com 204, mas nunca era
        # alcancado: /rest/v1/ casa com um prefixo mais especifico. Medido no
        # navegador em 05/10/2026 - a contingencia estava quebrada para
        # qualquer usuario real, e os testes por curl nao mostravam, porque
        # curl nao faz preflight.
        location /rest/v1/ {
            if ($request_method = OPTIONS) { return 204; }
            if ($sem_apikey) { return 401 '{"message":"No API key found in request"}'; }
            proxy_pass http://127.0.0.1:3000/;
            include /etc/nginx/cabecalhos.conf;
        }

        # A ROTA PUBLICA DO STORAGE NAO PODE EXIGIR APIKEY.
        #
        # Ela existe para ser chamada SEM cabecalho nenhum - e o que um
        # <img src="..."> consegue fazer, e e assim que o ERP mostra foto de
        # colaborador, avatar, logo e anexo de aviso (10 usos de getPublicUrl
        # no src/). A trava de apikey a barrava com 401, e o efeito era TODA
        # imagem de balde publico quebrada em contingencia - sete baldes:
        # colaboradores-fotos, avatars, cs-formularios, trn-midia,
        # cartao-logos, bi-capas e avisos-anexos.
        #
        # Medido no navegador em 05/10/2026: rota autenticada devolvia 200 com
        # os 190.177 bytes certos, e a publica do MESMO arquivo devolvia 401.
        # Nenhum teste por curl com apikey mostraria isso, porque o curl
        # mandava a chave que o <img> nunca manda.
        #
        # Nao expoe nada que ja nao estivesse exposto: balde publico e publico
        # por decisao de quem o criou, e a producao serve essas mesmas URLs sem
        # chave. O que e privado continua atras do apikey, no bloco abaixo.
        location /storage/v1/object/public/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://127.0.0.1:5000/object/public/;
            include /etc/nginx/cabecalhos.conf;
        }

        location /storage/v1/ {
            if ($request_method = OPTIONS) { return 204; }
            if ($sem_apikey) { return 401 '{"message":"No API key found in request"}'; }
            proxy_pass http://127.0.0.1:5000/;
            include /etc/nginx/cabecalhos.conf;
        }

        # Para a Render saber que o servico esta vivo, E para o ERP perguntar
        # se a replica responde antes de oferecer o modo consulta.
        #
        # O CORS aqui NAO e enfeite: sem ele o navegador bloqueia a pergunta
        # que o ERP faz de outro dominio, a resposta nunca chega, e o botao
        # "Consultar em modo leitura" simplesmente nao aparece - sem erro
        # visivel, porque o bloqueio e do navegador. Descoberto em 02/10/2026
        # testando o build local: o /rest/v1/ ja tinha CORS e o /saude nao.
        #
        # Liberar * aqui nao expoe nada: a resposta e a palavra "ok", sem
        # tocar no banco.
        # A REPLICA DIZ COMO FALAR COM ELA
        #
        # O ERP precisa da chave anon DESTA replica para usa-la em
        # contingencia - ela e assinada com outro segredo, a de producao nao
        # serve. Essa chave nao podia ir para o codigo: o repositorio e
        # publico, e credencial versionada e credencial vazada, mesmo quando
        # a RLS protege os dados.
        #
        # Entao quem entrega a chave e a propria replica, aqui. No codigo do
        # ERP fica so o ENDERECO, que ja e publico de qualquer forma.
        #
        # Isto nao esconde nada de ninguem - a chave anon chega ao navegador
        # de todo usuario, como a de producao. O ganho e nao versionar
        # credencial num repositorio aberto, e poder trocar a chave sem
        # reconstruir o ERP.
        location = /contingencia.json {
            add_header Access-Control-Allow-Origin  * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Cache-Control 'public, max-age=300' always;
            # Servido de ARQUIVO, nao com return: o nginx nao interpola
            # variavel de ambiente na configuracao (o mesmo tropeco que o Kong
            # nos deu). Quem escreve o arquivo e o iniciar.sh, no boot, com o
            # valor real de ANON_KEY.
            default_type application/json;
            alias /var/lib/nginx/contingencia.json;
        }

        location = /saude {
            add_header Access-Control-Allow-Origin  * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Content-Type text/plain;
            return 200 'ok';
        }
    }
}
