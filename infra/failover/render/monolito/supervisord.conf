; ============================================================================
;  Supervisor dos processos da replica
; ============================================================================
;  Quem decide a ORDEM e a prioridade: o Postgres sobe primeiro (priority 10) e
;  os que dependem dele esperam o preparar-banco.sh confirmar que ele responde.
;  Sem isso, todos sobem juntos, falham por "connection refused" e entram em
;  loop de reinicio - exatamente o sintoma que ja nos custou tempo no compose.
; ============================================================================
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; --- banco ------------------------------------------------------------------
[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D %(ENV_PGDATA)s -c listen_addresses=127.0.0.1 -c port=5432
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- API (aplica as 1.445 policies de RLS) ----------------------------------
[program:postgrest]
command=/usr/local/bin/postgrest
environment=PGRST_DB_URI="postgres://authenticator:%(ENV_POSTGRES_PASSWORD)s@127.0.0.1:5432/postgres",PGRST_DB_SCHEMAS="public,storage",PGRST_DB_ANON_ROLE="anon",PGRST_JWT_SECRET="%(ENV_JWT_SECRET)s",PGRST_DB_USE_LEGACY_GUCS="false",PGRST_SERVER_PORT="3000",PGRST_SERVER_HOST="127.0.0.1"
priority=20
autostart=true
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- login ------------------------------------------------------------------
; GOTRUE_JWT_AUD e obrigatorio: sem ele o GoTrue procura o usuario por e-mail e
; audiencia VAZIA, e os 154 logins restaurados tem aud='authenticated'. O
; resultado seria "Invalid login credentials" para todo mundo - parecendo senha
; errada. Medido em 30/09/2026.
[program:gotrue]
command=/usr/local/bin/esperar-banco.sh /usr/local/bin/gotrue
environment=GOTRUE_API_HOST="127.0.0.1",GOTRUE_API_PORT="9999",GOTRUE_DB_DRIVER="postgres",GOTRUE_DB_DATABASE_URL="postgres://supabase_auth_admin:%(ENV_POSTGRES_PASSWORD)s@127.0.0.1:5432/postgres",GOTRUE_JWT_SECRET="%(ENV_JWT_SECRET)s",GOTRUE_JWT_EXP="3600",GOTRUE_JWT_DEFAULT_GROUP_NAME="authenticated",GOTRUE_JWT_AUD="authenticated",GOTRUE_DISABLE_SIGNUP="true",GOTRUE_MAILER_AUTOCONFIRM="true",GOTRUE_EXTERNAL_EMAIL_ENABLED="true",API_EXTERNAL_URL="%(ENV_URL_PUBLICA)s",GOTRUE_SITE_URL="%(ENV_URL_SITE)s",GOTRUE_URI_ALLOW_LIST="%(ENV_URL_SITE)s"
priority=20
autostart=true
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- as 59 Edge Functions ---------------------------------------------------
; VERIFY_JWT fica false porque quem decide e o roteador em /home/deno/main,
; funcao por funcao, lendo o config.toml da producao. Um interruptor global
; quebraria as 14 publicas.
[program:functions]
command=/usr/local/bin/edge-runtime start --main-service /home/deno/main --port 9000
environment=JWT_SECRET="%(ENV_JWT_SECRET)s",SUPABASE_URL="%(ENV_URL_PUBLICA)s",SUPABASE_ANON_KEY="%(ENV_ANON_KEY)s",SUPABASE_SERVICE_ROLE_KEY="%(ENV_SERVICE_ROLE_KEY)s",SUPABASE_PUBLISHABLE_KEY="%(ENV_ANON_KEY)s",SUPABASE_DB_URL="postgres://postgres:%(ENV_POSTGRES_PASSWORD)s@127.0.0.1:5432/postgres",VERIFY_JWT="false"
priority=30
autostart=true
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- arquivos ---------------------------------------------------------------
; autostart=false: quem liga e o iniciar.sh, e SO se o modulo nativo fs-xattr
; tiver sido recompilado com sucesso na build. Sem isso o storage entra em loop
; e polui o log de todo mundo.
[program:storage]
command=/usr/local/bin/esperar-banco.sh node /opt/storage/dist/start/server.js
directory=/opt/storage
environment=ANON_KEY="%(ENV_ANON_KEY)s",SERVICE_KEY="%(ENV_SERVICE_ROLE_KEY)s",PGRST_JWT_SECRET="%(ENV_JWT_SECRET)s",AUTH_JWT_SECRET="%(ENV_JWT_SECRET)s",JWT_SECRET="%(ENV_JWT_SECRET)s",DATABASE_URL="postgres://supabase_storage_admin:%(ENV_POSTGRES_PASSWORD)s@127.0.0.1:5432/postgres",POSTGREST_URL="http://127.0.0.1:3000",FILE_SIZE_LIMIT="52428800",STORAGE_BACKEND="file",FILE_STORAGE_BACKEND_PATH="/var/lib/postgresql/data/storage",TENANT_ID="stub",REGION="stub",GLOBAL_S3_BUCKET="stub",SERVER_PORT="5000",SERVER_HOST="127.0.0.1"
priority=30
autostart=false
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- gateway (o unico que escuta para fora) ---------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- recarga diaria ----------------------------------------------------------
; Mantem a replica atualizada sem precisar de um cron job separado na Render
; (que custaria mais US$ 7/mes por 2 minutos de trabalho por dia).
; Desligada por padrao: so liga com RECARGA_AUTOMATICA=sim, e so funciona com
; GITHUB_TOKEN e a chave GPG configurados.
[program:recarga]
command=/usr/local/bin/recarga-diaria.sh
priority=50
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
