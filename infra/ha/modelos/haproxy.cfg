# HAProxy que roda NA MÁQUINA DA API, escutando em 127.0.0.1:5000.
#
# Por que aqui e não numa máquina própria: se ele morasse sozinho, seria um
# ponto único de falha novo, e precisaria de IP flutuante + script nosso
# remanejando endereço — a parte frágil do desenho. Rodando junto da API,
# se ele cai a API já estava fora de qualquer jeito.
#
# Como ele sabe quem é o primário: o Patroni responde 200 em /primary só no
# líder, e 503 na standby. Então o HAProxy nunca manda escrita para a réplica.
global
  maxconn 2000
  log stdout format raw local0

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 3s
  timeout client  30m
  timeout server  30m
  # 03/11/2026: conexão OCIOSA não pode cair a cada 30 min. O PostgREST
  # mantém uma conexão parada em LISTEN (canal "pgrst") e o "timeout client/
  # server 30m" acima a derrubava pontualmente de 30 em 30 min o dia inteiro
  # ("Failed listening for notifications ... server closed the connection").
  # Cada reconexão faz o PostgREST recarregar o schema; sob carga a recarga
  # estoura e ele descarta o pool — foi assim que a queda das 13:47 UTC
  # começou (docs/incidentes/2026-11-03-post-mortem.md, C2).
  # "timeout tunnel" vale para a conexão TCP já estabelecida e substitui os
  # dois acima. Failover não depende disto: on-marked-down shutdown-sessions
  # continua derrubando na hora as sessões do nó que deixou de ser primário.
  timeout tunnel  24h
  # Keepalive de TCP nos dois lados: um par que sumiu sem FIN (rede caiu) é
  # descoberto pelo kernel em vez de ficar 24 h pendurado.
  option clitcpka
  option srvtcpka

listen postgres_primario
  # Dois enderecos, e nenhum deles publico:
  #   127.0.0.1    para quem roda direto na maquina
  #   172.17.0.1   a ponte do Docker -- e por aqui que os containers da pilha
  #                (postgrest, gotrue, storage) alcancam o banco.
  # Nunca 0.0.0.0: o Docker insere regras de iptables que passam POR CIMA do
  # ufw, entao "o ufw bloqueia" nao seria garantia nenhuma aqui.
  bind 127.0.0.1:5000
  bind 172.17.0.1:5000
  bind 172.28.0.1:5000
  option httpchk GET /primary
  http-check expect status 200
  # on-marked-down shutdown-sessions: derruba na hora as conexões presas no
  # nó que caiu. Sem isto o cliente fica esperando um socket que não volta.
  default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
  server banco1 __IP_BANCO1__:5432 check port 8008
  server banco2 __IP_BANCO2__:5432 check port 8008

# Opcional: só leitura, balanceando entre os dois. Útil para relatório pesado.
listen postgres_leitura
  bind 127.0.0.1:5001
  bind 172.17.0.1:5001
  bind 172.28.0.1:5001
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server banco1 __IP_BANCO1__:5432 check port 8008
  server banco2 __IP_BANCO2__:5432 check port 8008

listen estatisticas
  mode http
  bind 127.0.0.1:7000
  stats enable
  stats uri /
  stats refresh 5s
