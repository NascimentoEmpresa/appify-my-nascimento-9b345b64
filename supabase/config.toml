# Webhook público da Meta — chamado sem JWT (a validação é pela assinatura
# X-Hub-Signature-256 com o WHATSAPP_APP_SECRET).
[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-enviar]
verify_jwt = true

[functions.notificar-chamado-whatsapp]
verify_jwt = true

# Chamadas pelo GitHub Actions (CI), não por usuário logado — autenticação
# própria por secret compartilhado (CHAMADOS_CI_SECRET), não JWT da Supabase.
[functions.chamado-info]
verify_jwt = false

[functions.chamado-vincular-pr]
verify_jwt = false

# Canal de Ética — as duas rotas públicas do formulário /denuncia. Sem JWT de
# propósito: o navegador manda JSON puro e a chave anon fica só dentro da
# função, no servidor. Quem valida é a RPC (registro) e o par protocolo+senha
# conferido contra o hash (consulta).
[functions.denuncia-registrar]
verify_jwt = false

[functions.denuncia-consultar]
verify_jwt = false

# Conversa do denunciante com o comitê. Mesmo modelo: a credencial é o par
# e-mail + senha conferido pela RPC a cada chamada, não uma sessão.
[functions.denuncia-conversa]
verify_jwt = false
