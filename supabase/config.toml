[functions.copiloto-acoes-chat]
verify_jwt = true

[functions.copiloto-acoes-transcrever]
verify_jwt = true

[functions.copiloto-acoes-criar]
verify_jwt = true

[functions.copiloto-acoes-analise]
verify_jwt = true

[functions.fcr-load]
verify_jwt = true

[functions.dump-regras]
verify_jwt = true

[functions.erp-caixa-export]
verify_jwt = true

# Chamada pelo trigger trg_chamado_concluido_novidade_ia via pg_net, que manda
# a chave anon nos headers — JWT válido, então a verificação fica ligada.
[functions.novidade-ia-chamado]
verify_jwt = true

# Canal de Ética — anexos de quem denuncia. Público de propósito: o site roda
# sem login e sem chave no navegador. Quem autentica é protocolo + senha,
# conferidos dentro da função contra o hash bcrypt.
[functions.denuncia-anexar]
verify_jwt = false

# Listas do formulário público (empresas e contratos). Público pelo mesmo
# motivo das demais rotas do canal: o site roda sem login.
[functions.denuncia-listas]
verify_jwt = false

# Tick de alertas do Comitê. Chamado pelo pg_cron com a chave anon.
[functions.comite-etica-alertas-tick]
verify_jwt = true

# Webhook público da Meta — chamado sem JWT (a validação é pela assinatura
# X-Hub-Signature-256 com o WHATSAPP_APP_SECRET).
[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-enviar]
verify_jwt = true

[functions.notificar-chamado-whatsapp]
verify_jwt = true

# Chamadas pelo GitHub Actions (CI), não por usuário logado — autenticação
# própria por secret compartilhado (CHAMADOS_CI_SECRET), não JWT da Supabase.
[functions.chamado-info]
verify_jwt = false

[functions.chamado-vincular-pr]
verify_jwt = false

[functions.chamado-concluir-pr]
verify_jwt = false

# Chamada tanto pelo front-end (usuário logado, JWT da Supabase) quanto pela
# chamado-concluir-pr, que roda a partir do CI e não tem sessão. Por isso o
# gateway não exige JWT: quem valida é a própria função, que aceita só duas
# origens — sessão válida da Supabase ou o CHAMADOS_CI_SECRET — e devolve 401
# em qualquer outro caso.
[functions.enviar-notificacao-push]
verify_jwt = false

# Canal de Ética — as duas rotas públicas do formulário /denuncia. Sem JWT de
# propósito: o navegador manda JSON puro e a chave anon fica só dentro da
# função, no servidor. Quem valida é a RPC (registro) e o par protocolo+senha
# conferido contra o hash (consulta).
[functions.denuncia-registrar]
verify_jwt = false

[functions.denuncia-consultar]
verify_jwt = false

# Conversa do denunciante com o comitê. Mesmo modelo: a credencial é o par
# e-mail + senha conferido pela RPC a cada chamada, não uma sessão.
[functions.denuncia-conversa]
verify_jwt = false

# Cadastro de fornecedor preenchido pelo proprio fornecedor (SIS-2026-0209).
# Publica de proposito: quem preenche e alguem de fora, que nao tem conta no
# ERP. A credencial e o token do convite, gerado pelo comprador e queimado
# depois do uso — quem valida e a RPC, que a funcao alcanca com a chave anon.
[functions.fornecedor-cadastro-publico]
verify_jwt = false
