# Backup independente do banco de producao.
#
# POR QUE EXISTE
# A Supabase ja faz copia diaria (Database > Backups) e vende PITR. As duas
# ficam na infraestrutura DELES. Este backup existe para a unica pergunta que
# nenhuma das duas responde: "e se a conta/o fornecedor sumir?". O artefato
# gerado aqui vive no GitHub, fora da Supabase, e restaura em qualquer Postgres.
#
# POR QUE NO ACTIONS E NAO NA MAQUINA DO EDUARDO
# Mesmo motivo do espelho_mysql.yml: a rede da empresa bloqueia porta na saida,
# e a maquina dele nao fica ligada de madrugada. O runner nao tem esses dois
# problemas.
#
# MEDIDO EM 24/09/2026 CONTRA PRODUCAO (nao e estimativa)
#   duracao ............ 1min14s da maquina do Eduardo (Brasil)
#                        7min05s do runner do GitHub (28/09, primeira execucao
#                        que passou). A diferenca e latencia de rede ate
#                        sa-east-1, nao o banco: 0 bloqueios nos dois casos.
#   tamanho ............ 106,4 MB  (de um banco de 1,61 GB)
#   conexoes usadas .... 1 de 90
#   bloqueios ativos ... 0 (pg_dump NAO trava escrita; usa snapshot)
#   cache hit .......... caiu de 99,99% para 99,97% durante a copia
#   restauracao ........ 40s, e as contagens bateram LINHA A LINHA com producao
#                        (sup_pedido 2.247, EMPREGADOS 13.355,
#                         BiMarcacoes 3.748.805, auth.users 155)
#
# ISSO NAO E MAIS UMA MEDICAO DE UM DIA SO
# Desde 28/09/2026 a restauracao e testada em TODA execucao, dentro deste
# mesmo job, num postgres:17 puro - ver o passo "Provar que o backup restaura".
# Backup que nao restaura nao chega a ser publicado.
#
# O ARTEFATO E CRIPTOGRAFADO
# Desde 28/09/2026 o que sobe e `.dump.gpg`, nao `.dump`. O motivo esta
# inteiro no comentario do passo "Criptografar antes de publicar": este
# repositorio e publico. Para restaurar e preciso a chave privada do Eduardo -
# o passo de descriptografia esta em docs/restaurar-backup.md.
#
# O QUE ESTE BACKUP NAO COBRE
# Arquivos do Storage (anexos, fotos de cracha, XML). O banco guarda so os
# METADADOS deles - o mesmo aviso que a propria Supabase da na tela de backups.
# Restaurar este dump devolve a lista de arquivos, nao os arquivos. Medido em
# 28/09/2026: sao 7.380 arquivos e 4.465 MB - quase 3x o tamanho do banco.
#
# E NAO E FAILOVER
# Ninguem aplica isto sozinho quando o banco cai. Restaurar e decisao humana,
# leva dezenas de minutos e faz perder tudo que veio depois do ponto copiado.
# Na queda de 23/09, restaurar teria sido a PIOR escolha: o banco estava
# integro, so sufocado, e um restart resolveu em 30 segundos.

name: Backup do banco

on:
  workflow_dispatch:
    inputs:
      retencao_dias:
        description: 'Por quantos dias guardar este artefato'
        type: string
        default: '14'
  schedule:
    # 07, 10, 13, 16 e 20h de Brasilia (UTC-3), so no EXPEDIENTE.
    #
    # Eram duas vezes ao dia (09:00 e 21:00 UTC), com perda maxima de 12h. A
    # replica de failover mudou a necessidade: ela recarrega a partir DESTE
    # artefato, e o elo mais lento define o atraso. Recarregar a replica cinco
    # vezes ao dia com backup de 12 em 12 horas nao adiantaria nada - ela
    # buscaria o mesmo arquivo cinco vezes.
    #
    # Por que nao de hora em hora: cada execucao le o banco INTEIRO e leva de
    # 6 a 9 minutos. Vinte e quatro por dia dariam ~3 horas diarias de leitura
    # completa numa instancia Small que ja caiu tres vezes este ano (CPU,
    # conexoes e memoria) - risco de derrubar o ERP justamente para proteger
    # contra ele cair. Cinco execucoes dao ~45 min por dia.
    #
    # Por que so no expediente: de madrugada ninguem mexe no sistema, e copiar
    # as 3h da manha produziria exatamente o mesmo conteudo das 20h.
    #
    # A janela descoberta e das 20h as 7h. Uma mudanca feita as 21h so e
    # copiada no dia seguinte - aceitavel porque e fora do expediente, e e o
    # motivo de o ultimo horario ser 20h e nao 19h.
    - cron: '0 10,13,16,19,23 * * *'

# Duas copias ao mesmo tempo nao corrompem nada, mas dobram a leitura no banco
# de producao a toa.
concurrency:
  group: backup-banco
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # Medido em 7min05s pelo runner (1min14s local); com o teste de restauracao,
    # ~10min. 30 minutos e folga; se passar disso, alguma coisa esta errada e e
    # melhor falhar e avisar.
    timeout-minutes: 30

    # Postgres PURO, sem nada da Supabase, so para provar que o backup restaura.
    # E de proposito que e o postgres oficial e nao uma imagem da Supabase: o
    # cenario que este backup existe para cobrir e "a Supabase sumiu". Se o dump
    # so restaurasse dentro da Supabase, ele nao cobriria esse cenario.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Pegar so a chave publica do repositorio
        # Este workflow rodou de 24/09 a 28/09 SEM checkout nenhum, e estava
        # certo: ele so chamava pg_dump contra um host remoto, nao lia arquivo
        # do repositorio. O passo de criptografia mudou isso - ele precisa de
        # `.github/backup-chave-publica.asc`.
        #
        # A primeira execucao com criptografia (36494436511, 28/09/2026) falhou
        # exatamente por isso, depois de 6 minutos gerando o dump:
        #   gpg: can't open '.github/backup-chave-publica.asc': No such file or directory
        #   gpg: encryption failed: No public key
        # Falhou de forma segura - nada foi publicado -, mas queimou o dump.
        #
        # sparse-checkout traz so esse arquivo em vez do repositorio inteiro
        # (~16 mil arquivos): o job nao precisa de mais nada.
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/backup-chave-publica.asc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Instalar pg_dump 17
        # O Ubuntu do runner traz um client mais antigo. pg_dump precisa ser
        # >= a versao do servidor (a Supabase roda 17.6), senao recusa a copia.
        #
        # Na primeira execucao agendada (28/09/2026) este passo instalava o
        # postgresql-client-16 e o backup morria em 1,2 s com:
        #   pg_dump: error: aborting because of server version mismatch
        #   pg_dump: detail: server version: 17.6; pg_dump version: 16.15
        # Dai as tres travas abaixo: instalar o 17, por o diretorio dele na
        # frente do PATH (o runner ja traz um pg_dump 16 em /usr/bin, e o
        # pg_wrapper do Debian pode escolher o errado), e abortar com mensagem
        # clara se mesmo assim a versao vier menor que 17.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # Vale para todos os passos seguintes (pg_dump e pg_restore).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"

          VERSAO=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump em uso: $(command -v pg_dump) -> $(pg_dump --version)"
          if [ "$VERSAO" -lt 17 ]; then
            echo "::error::pg_dump $VERSAO e mais antigo que o servidor (17.6). O backup nao rodaria."
            exit 1
          fi

      - name: Gerar o backup
        env:
          # Mesmo secret do espelho_mysql.yml: o credenciais.json inteiro. Ele
          # ja carrega host, porta, usuario, banco e senha do Postgres - nao
          # precisa de secret novo.
          CREDENCIAIS: ${{ secrets.ESPELHO_CREDENCIAIS }}
        run: |
          set -euo pipefail

          PGHOST=$(echo "$CREDENCIAIS"  | jq -r '.supabase.host')
          PGPORT=$(echo "$CREDENCIAIS"  | jq -r '.supabase.porta')
          PGUSER=$(echo "$CREDENCIAIS"  | jq -r '.supabase.usuario')
          PGDATABASE=$(echo "$CREDENCIAIS" | jq -r '.supabase.banco')
          PGPASSWORD=$(echo "$CREDENCIAIS" | jq -r '.supabase.senha')
          export PGHOST PGPORT PGUSER PGDATABASE PGPASSWORD
          export PGSSLMODE=require

          ARQUIVO="backup-$(date -u +%Y%m%d-%H%M%S).dump"
          echo "ARQUIVO=$ARQUIVO" >> "$GITHUB_ENV"

          # Schemas de negocio. `extensions`, `graphql`, `vault` e afins ficam
          # de fora: sao recriados pelo proprio Supabase num projeto novo, e
          # incluir sem os papeis dele so gera ruido na restauracao.
          #
          # --no-owner / --no-privileges: o dono das tabelas na origem e o
          # `postgres` da Supabase. Sem estas flags, restaurar em outro lugar
          # falha em toda linha de ownership.
          time pg_dump \
            --format=custom \
            --compress=6 \
            --no-owner \
            --no-privileges \
            --schema=public \
            --schema=espelho \
            --schema=auth \
            --schema=storage \
            -f "$ARQUIVO"

          ls -la "$ARQUIVO"

      - name: Conferir que o arquivo presta
        # Um dump truncado sobe sem reclamar e so se descobre no dia do
        # desastre. Estas duas checagens custam segundos e evitam guardar lixo.
        run: |
          set -euo pipefail

          # 1. O arquivo abre e o indice esta completo?
          pg_restore --list "$ARQUIVO" > conteudo.txt
          TABELAS=$(grep -c 'TABLE DATA' conteudo.txt || true)
          echo "tabelas com dados no backup: $TABELAS"

          # Em 24/09 eram 631; em 28/09, 634. Menos de 300 e copia parcial.
          if [ "$TABELAS" -lt 300 ]; then
            echo "::error::Backup com apenas $TABELAS tabelas - esperado mais de 300. Copia provavelmente parcial."
            exit 1
          fi

          # 2. Tamanho plausivel? Em 24/09 foram 106 MB.
          BYTES=$(stat -c%s "$ARQUIVO")
          echo "tamanho: $((BYTES / 1048576)) MB"
          if [ "$BYTES" -lt 10485760 ]; then
            echo "::error::Backup com menos de 10 MB - quase certamente truncado."
            exit 1
          fi

      - name: Provar que o backup restaura
        # POR QUE ISTO RODA AQUI DENTRO, E NAO NUM WORKFLOW SEPARADO
        # O plano original era um workflow mensal de teste de restauracao. A
        # criptografia matou essa ideia: um workflow separado precisaria da
        # chave PRIVADA para abrir o .gpg, e por a chave privada num secret do
        # GitHub desfaz exatamente a protecao que o passo seguinte cria.
        #
        # Aqui dentro, entre gerar e cifrar, e o unico momento em que o runner
        # tem o texto claro por direito. Sai melhor que o plano: roda em TODA
        # execucao (2x por dia) em vez de 1x por mes, e um backup que nao passa
        # no teste NAO chega a ser publicado - em vez de guardarmos um arquivo
        # quebrado por 14 dias sem saber.
        #
        # POR QUE COMPARAR COM A PRODUCAO EM VEZ DE USAR NUMEROS FIXOS
        # Numero fixo envelhece: a base cresce e o teste vira mentira ou alarme
        # falso. Comparando com a producao ao vivo, a referencia se atualiza
        # sozinha. A tolerancia de 5% existe porque o dump e um retrato de um
        # instante e a producao continua andando enquanto o job roda - sem ela,
        # qualquer pedido novo reprovaria o backup.
        env:
          CREDENCIAIS: ${{ secrets.ESPELHO_CREDENCIAIS }}
        run: |
          set -euo pipefail

          PROD_HOST=$(echo "$CREDENCIAIS" | jq -r '.supabase.host')
          PROD_PORT=$(echo "$CREDENCIAIS" | jq -r '.supabase.porta')
          PROD_USER=$(echo "$CREDENCIAIS" | jq -r '.supabase.usuario')
          PROD_DB=$(echo "$CREDENCIAIS"   | jq -r '.supabase.banco')
          PROD_PASS=$(echo "$CREDENCIAIS" | jq -r '.supabase.senha')

          conta_prod() { PGPASSWORD="$PROD_PASS" PGSSLMODE=require \
            psql -h "$PROD_HOST" -p "$PROD_PORT" -U "$PROD_USER" -d "$PROD_DB" -At -c "$1"; }
          conta_rest() { PGPASSWORD=postgres \
            psql -h localhost -p 5432 -U postgres -d restaurado -At -c "$1"; }

          # OS PAPEIS DA SUPABASE PRECISAM EXISTIR ANTES DA RESTAURACAO.
          # Descoberto no ensaio de recuperacao de 29/09/2026, e e o achado mais
          # grave que esse ensaio produziu: `CREATE POLICY ... TO authenticated`
          # FALHA quando o papel `authenticated` nao existe. Num Postgres comum
          # nenhum papel da Supabase existe, entao praticamente toda a RLS caia
          # em silencio:
          #
          #   sem os papeis ....... 35 policies restauradas, 6.212 linhas de erro
          #   com os papeis ..... 1.443 policies restauradas,    78 linhas de erro
          #   producao no momento  1.447 policies
          #
          # E este teste passava VERDE nos dois casos, porque so conferia
          # contagem de linha. Um backup que volta com 2% da RLS nao e um backup
          # recuperavel: e um banco onde qualquer usuario le tudo.
          #
          # A lista saiu de pg_roles da producao. Papeis de sistema (pg_*) e o
          # proprio `postgres` ficam de fora.
          for PAPEL in anon authenticated authenticator cli_login_postgres \
                       dashboard_user service_role supabase_admin \
                       supabase_auth_admin supabase_etl_admin \
                       supabase_functions_admin supabase_privileged_role \
                       supabase_read_only_user supabase_realtime_admin \
                       supabase_replication_admin supabase_storage_admin; do
            PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -q \
              -c "create role \"$PAPEL\" nologin noinherit;" > /dev/null 2>&1 || true
          done
          echo "papeis da Supabase criados no destino: $(PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -At -c "select count(*) from pg_roles where rolname not like 'pg_%' and rolname <> 'postgres'")"

          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -q \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE restaurado TEMPLATE template0 ENCODING 'UTF8';"

          # ATENCAO AO `PGPASSWORD=` NA MESMA LINHA DO pg_restore.
          # Prefixo de variavel em shell vale SO para aquele comando. Na
          # primeira versao deste passo (execucao 36496892805, 28/09/2026) o
          # psql acima tinha o prefixo e o pg_restore nao tinha: ele tentou
          # conectar sem senha, o container recusou e ele morreu em 50 ms com
          # 2 linhas de erro. O banco `restaurado` existia e estava vazio, e a
          # comparacao acusou "relation public.sup_pedido does not exist".
          #
          # pg_restore reclama dos papeis que so existem na Supabase
          # (authenticated, anon, service_role). Isso e ESPERADO num Postgres
          # comum - em 24/09 foram 1.373 erros e a restauracao estava correta.
          # Ver docs/restaurar-backup.md. A validacao e por CONTAGEM, nunca por
          # ausencia de erro; por isso o `|| true`.
          PGPASSWORD=postgres pg_restore -h localhost -p 5432 -U postgres -d restaurado \
            --no-owner --no-privileges --jobs=4 "$ARQUIVO" 2> erros-restauracao.txt || true

          # IMPRIMIR, nao so contar. Na primeira versao eu so contava as linhas,
          # e foi exatamente isso que escondeu a causa da falha acima: "2 erros"
          # nao dizia nada, enquanto as 2 linhas diziam tudo.
          echo "linhas de erro do pg_restore: $(wc -l < erros-restauracao.txt)"
          echo "--- primeiras 20 (as de papel inexistente sao esperadas) ---"
          head -20 erros-restauracao.txt || true
          echo "-----------------------------------------------------------"

          FALHOU=0
          for T in 'public.sup_pedido' 'public.malote_despesa' 'public."EMPREGADOS"' \
                   'public.profiles' 'auth.users'; do
            P=$(conta_prod "select count(*) from $T")
            R=$(conta_rest "select count(*) from $T")
            if [ "$P" -eq 0 ]; then
              echo "::error::$T devolveu 0 linhas na PRODUCAO. Nao da para validar o backup contra isso."
              FALHOU=1
              continue
            fi
            DIF=$(( (R > P ? R - P : P - R) * 100 / P ))
            printf '%-26s producao=%-9s restaurado=%-9s diferenca=%s%%\n' "$T" "$P" "$R" "$DIF"
            if [ "$DIF" -gt 5 ]; then
              echo "::error::$T divergiu $DIF% (producao $P, backup $R). Copia provavelmente parcial."
              FALHOU=1
            fi
          done

          # CONTAR LINHA NAO BASTA - TEM QUE CONFERIR A SEGURANCA.
          # Ate 29/09/2026 este teste olhava so quantidade de linha, e por isso
          # deu verde durante dias enquanto 97,6% das policies de RLS falhavam
          # na restauracao. Dado completo com RLS ausente nao e recuperacao: e
          # um vazamento pronto. A tolerancia aqui e de 2%, apertada de
          # proposito - policy nao aparece nem some sozinha como linha de tabela.
          PP=$(conta_prod "select count(*) from pg_policies")
          PR=$(conta_rest "select count(*) from pg_policies")
          DIFP=$(( (PR > PP ? PR - PP : PP - PR) * 100 / PP ))
          printf '%-26s producao=%-9s restaurado=%-9s diferenca=%s%%\n' "RLS (pg_policies)" "$PP" "$PR" "$DIFP"
          if [ "$DIFP" -gt 2 ]; then
            echo "::error::A RLS nao voltou: producao tem $PP policies e o backup restaurou $PR. Backup restaurado sem RLS deixa todo usuario enxergar tudo."
            FALHOU=1
          fi

          # A maior tabela do banco. Contar na producao custaria varredura de
          # milhoes de linhas numa instancia que ja vive perto do limite de
          # memoria, entao aqui vale piso fixo: em 24/09 eram 3.748.805.
          BM=$(conta_rest 'select count(*) from espelho."BiMarcacoes"')
          echo "espelho.BiMarcacoes restaurado: $BM"
          if [ "$BM" -lt 3000000 ]; then
            echo "::error::BiMarcacoes voltou com $BM linhas - esperado mais de 3 milhoes."
            FALHOU=1
          fi

          if [ "$FALHOU" -ne 0 ]; then
            echo "::error::O backup NAO restaura corretamente. Ele nao sera publicado."
            exit 1
          fi
          echo "Backup restaurado e conferido contra a producao."

      - name: Criptografar antes de publicar
        # POR QUE ESTE PASSO EXISTE
        # Este repositorio e PUBLICO. Artifact de repositorio publico segue a
        # permissao de leitura do repositorio - ou seja, qualquer pessoa com
        # conta no GitHub. Em 28/09/2026 foi confirmado que a listagem responde
        # sem autenticacao nenhuma:
        #
        #   curl https://api.github.com/repos/<org>/<repo>/actions/artifacts
        #   -> HTTP 200, com nome, tamanho e sha256 do dump
        #
        # E o dump nao e um arquivo qualquer: tem o schema `auth` (155 usuarios
        # e os hashes de senha deles), "EMPREGADOS" (13.355 pessoas, com CPF),
        # malote e pagamentos. Formato custom do pg_dump e comprimido, nao
        # criptografado - quem baixasse dava pg_restore e tinha o ERP inteiro.
        # Isso e exposicao de dado pessoal, com consequencia de LGPD.
        #
        # Deixar o repositorio privado NAO resolveria: no plano free, repo
        # privado tem 500 MB de artifact storage e so o backup gera ~3 GB por
        # ciclo de retencao. Quebraria o backup.
        #
        # POR QUE CHAVE ASSIMETRICA E NAO SENHA
        # O runner tem so a chave PUBLICA (`.github/backup-chave-publica.asc`,
        # commitada de proposito - e publica, e para isso que serve). Com ela
        # ele CRIA backup criptografado e NAO consegue abrir nenhum. Se o
        # repositorio for comprometido, o atacante grava e nao le. Medido em
        # 28/09/2026, num chaveiro vazio igual ao do runner:
        #
        #   criptografar com a publica ....... OK
        #   descriptografar no mesmo lugar ... gpg: decryption failed: No secret key
        #   round-trip no chaveiro do Eduardo  sha256 identico
        #
        # A chave privada esta so com o Eduardo. PERDER A CHAVE PRIVADA E
        # PERDER TODOS OS BACKUPS, DE FORMA DEFINITIVA - ver docs/restaurar-backup.md.
        #
        # `--compress-algo none` porque o dump ja sai comprimido do pg_dump
        # (--compress=6); recomprimir so gastaria CPU. Medido: 0,9 s para 108 MB.
        run: |
          set -euo pipefail

          gpg --batch --yes --trust-model always --compress-algo none \
            --recipient-file .github/backup-chave-publica.asc \
            --encrypt --output "$ARQUIVO.gpg" "$ARQUIVO"

          # O texto claro nao pode sobreviver a este passo nem por engano.
          shred -u "$ARQUIVO" 2>/dev/null || rm -f "$ARQUIVO"

          # Trava: se por qualquer motivo o arquivo publicado ainda comecar com
          # a assinatura do pg_dump ("PGDMP"), ele esta em texto claro e o
          # backup NAO pode subir.
          if head -c 5 "$ARQUIVO.gpg" | grep -q "PGDMP"; then
            echo "::error::O arquivo a publicar esta em TEXTO CLARO. Abortando."
            exit 1
          fi

          echo "ARQUIVO_CIFRADO=$ARQUIVO.gpg" >> "$GITHUB_ENV"
          ls -la "$ARQUIVO.gpg"

      - name: Decidir por quantos dias guardar
        id: retencao
        run: |
          set -euo pipefail
          # RETENCAO DIFERENCIADA, por causa da frequencia nova.
          # Com cinco execucoes por dia e 14 dias para todas, seriam
          # 5 x 109 MB x 14 = ~7,6 GB guardados o tempo todo. Mas backup de
          # meio de expediente serve para UMA coisa: alimentar a recarga da
          # replica, que acontece 30 min depois. Ninguem vai restaurar o de
          # terca as 13h daqui a dez dias.
          #
          # Entao: o PRIMEIRO e o ULTIMO do dia (07h e 20h de Brasilia) sao o
          # historico de verdade e ficam 14 dias. Os do meio ficam 3 - tempo de
          # sobra para a replica recarregar e para alguem investigar um
          # problema do mesmo dia.
          #   5 x 109 MB: 2 por 14 dias (3,0 GB) + 3 por 3 dias (1,0 GB) = 4 GB
          if [[ -n "${{ github.event.inputs.retencao_dias }}" ]]; then
            DIAS="${{ github.event.inputs.retencao_dias }}"     # pedido a mao manda
          else
            HORA=$(date -u +%H)
            case "$HORA" in
              23) DIAS=90 ;;   # 20h de Brasilia: ARQUIVO de longo prazo (o
                               # ultimo do dia). 90 dias e o maximo do GitHub;
                               # em repo publico o armazenamento e gratuito.
                               # Ponte ate o arquivo definitivo no servidor.
              10) DIAS=14 ;;   # 07h de Brasilia: historico de curto prazo
              *)  DIAS=3  ;;   # meio do expediente: so alimenta a replica
            esac
          fi
          echo "dias=$DIAS" >> "$GITHUB_OUTPUT"
          echo "  guardando por $DIAS dias (execucao das $(date -u +%H:%M) UTC)"

      - name: Guardar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARQUIVO_CIFRADO }}
          path: ${{ env.ARQUIVO_CIFRADO }}
          retention-days: ${{ steps.retencao.outputs.dias }}
          compression-level: 0   # o dump ja vem comprimido; recomprimir so gasta tempo
          if-no-files-found: error

      - name: Avisar no Discord se falhou
        if: failure()
        # DM PARA O EDUARDO, NUNCA CANAL.
        # Ate 29/09/2026 este aviso ia para o DISCORD_WEBHOOK_URL, que cai num
        # canal com varias pessoas. Backup falhando nao e assunto de canal
        # coletivo: quem pode agir e uma pessoa so, e para os demais e ruido -
        # e exposicao de problema interno. Mesmo padrao do pr_notify_dm.yml.
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DESTINO: ${{ vars.DISCORD_USER_ID_EDUARDO || '1384572666752663653' }}
        run: |
          if [ -z "${DISCORD_TOKEN:-}" ]; then
            echo "DISCORD_TOKEN nao configurado - sem aviso."
            exit 0
          fi
          API="https://discord.com/api/v10"
          UA="DiscordBot (https://github.com/NascimentoEmpresa/appify-my-nascimento-9b345b64, 1.0)"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          CANAL=$(curl -sS -X POST "$API/users/@me/channels" \
                    -H "Authorization: Bot $DISCORD_TOKEN" \
                    -H "Content-Type: application/json" -A "$UA" \
                    -d "{\"recipient_id\":\"$DESTINO\"}" | jq -r '.id // empty')

          if [ -z "$CANAL" ]; then
            echo "::warning::Nao consegui abrir DM no Discord. Ninguem foi avisado."
            exit 0
          fi

          jq -n --arg c ":x: **Backup do banco FALHOU**
          O ultimo backup bom pode estar com ate 12h de atraso.
          $RUN" '{content:$c}' \
            | curl -sS -X POST "$API/channels/$CANAL/messages" \
                -H "Authorization: Bot $DISCORD_TOKEN" \
                -H "Content-Type: application/json" -A "$UA" -d @- > /dev/null
          echo "aviso de falha enviado por DM."
