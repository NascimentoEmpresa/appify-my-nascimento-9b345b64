name: Concluir Chamado pela PR

# Fecha o último passo manual do ciclo: a PR que resolve um chamado conclui o
# chamado sozinha no ERP — sem o dev precisar abrir /app/sistemas/chamados/:id
# e clicar em "Concluir chamado".
#
# DESDE 12/11/2026 (pedido do Pablo: "quando o desenvolvedor abrir um PR
# conclua o chamado automaticamente e também coloque um resumo bom do que foi
# feito no chat pro solicitante ver ... e as URLS pra ele acessar"):
#   · job concluir-na-abertura — PR aberta (ou reaberta, ou saída de rascunho)
#     conclui o chamado;
#   · job concluir-chamado — no MERGE: conclui como reserva (PR aberta antes
#     desta mudança, título corrigido depois) e manda o RESUMO para o chat.
#
# RESUMO SÓ NO MERGE (13/11/2026). Pablo: "a i.a tem que ler os commits e a PR
# inteira depois do merge, pq enquanto a PR tá no github ela ainda pode ter
# mais commits". No SIS-2026-0854 a PR #1250 abriu às 23:49 só com commits do
# Mural; o do chamado subiu às 23:52 e a I.A — que via só a 1ª linha dos
# commits e o nome dos arquivos — reescreveu o PEDIDO como se fosse a entrega.
# Agora o merge manda, da PR já fechada: só os commits DESTE chamado (a PR da
# branch pessoal junta vários), a mensagem inteira de cada um, o código
# alterado neles e as URLs das telas (.github/scripts/contexto-resumo-pr.cjs).
# A Edge manda o resumo uma vez por PR e não manda para chamado reaberto.
#
# "Concluído" aqui é o mesmo do botão: o chamado fica aguardando o SOLICITANTE
# confirmar a conclusão (mig 20261028001300) e, até ele confirmar, conta na
# trava de 3 pendências para abrir chamado novo. O merge NÃO confirma por ele.
#
# Arquivo separado do chamado_pr_sync.yml de propósito: lá o job
# validar-chamado é required status check na proteção da main, e acrescentar o
# evento "closed" aos gatilhos daquele arquivo mexeria com o merge de toda PR.
#
# pull_request_target (não pull_request): precisa dos secrets do repositório
# base. NÃO executamos nada do código da branch da PR. No merge, o checkout é
# do commit de merge (o que já está na main), só da pasta .github/scripts; o
# App.tsx e os trechos alterados chegam como TEXTO pela API e só são lidos.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]

jobs:
  concluir-na-abertura:
    # Rascunho não é entrega: conclui quando sai do rascunho (ready_for_review).
    if: >-
      (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review')
      && github.event.pull_request.draft == false
      && startsWith(github.event.pull_request.title, 'SIS-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Concluir o chamado (o resumo vai no merge)
        uses: actions/github-script@v7
        env:
          SUPABASE_FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL || 'https://fwmzeaztjxrxxzxzxmgc.supabase.co/functions/v1' }}
          CHAMADOS_CI_SECRET: ${{ secrets.CHAMADOS_CI_SECRET }}
        with:
          script: |
            // Best-effort do começo ao fim: nunca falha o workflow (não é check
            // obrigatório e um erro aqui não tem nada a corrigir na PR).
            const pr = context.payload.pull_request;
            const titulo = pr.title || "";
            const m = titulo.match(/^SIS-\d{4}-\d+/);
            if (!m) { core.info("Título sem número de chamado — nada a concluir."); return; }
            try {
              const res = await fetch(`${process.env.SUPABASE_FUNCTIONS_URL}/chamado-concluir-pr`, {
                method: "POST",
                headers: { Authorization: `Bearer ${process.env.CHAMADOS_CI_SECRET}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                  origem: "pr_aberta",
                  numero: m[0],
                  pr_url: pr.html_url,
                  pr_titulo: titulo,
                  pr_autor_github: pr.user.login,
                  pr_numero: pr.number,
                  pr_commits: pr.commits ?? null,
                  pr_linhas_adicionadas: pr.additions ?? null,
                  pr_arquivos_alterados: pr.changed_files ?? null,
                }),
                signal: AbortSignal.timeout(30000),
              });
              const corpo = await res.text();
              if (!res.ok) { core.warning(`chamado-concluir-pr respondeu HTTP ${res.status}: ${corpo}`); return; }
              core.info(`Resposta: ${corpo}`);
              const j = JSON.parse(corpo);
              if (j.concluido) core.info(`Chamado ${m[0]} concluído. O resumo para o solicitante sai no merge.`);
              else core.warning(`Chamado ${m[0]} não foi concluído: ${j.motivo || "motivo não informado"}`);
            } catch (e) {
              core.warning(`Não foi possível contatar o serviço de chamados — ${m[0]} segue aberto para conclusão manual (${e.message}).`);
            }

  concluir-chamado:
    # PR fechada sem merge não conclui nada — só o merge significa entrega.
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout do merge (só os scripts — nada é executado da PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sparse-checkout: |
            .github/scripts
          persist-credentials: false

      - name: Concluir (reserva) e mandar o resumo da PR mergeada
        uses: actions/github-script@v7
        env:
          # Um lugar só para a virada: a variável de repositório
          # SUPABASE_FUNCTIONS_URL (Settings > Variables) troca o backend sem
          # mexer em workflow. Sem ela, continua na Supabase.
          SUPABASE_FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL || 'https://fwmzeaztjxrxxzxzxmgc.supabase.co/functions/v1' }}
          CHAMADOS_CI_SECRET: ${{ secrets.CHAMADOS_CI_SECRET }}
        with:
          script: |
            // Best-effort: o merge já aconteceu, então falhar aqui só acende
            // alarme vermelho sem nada para corrigir na PR.
            const pr = context.payload.pull_request;
            const titulo = pr.title || "";
            const m = titulo.match(/^SIS-\d{4}-\d+/);
            if (!m) { core.info("PR sem chamado vinculado — nada a concluir."); return; }
            const { owner, repo } = context.repo;
            const scripts = `${process.env.GITHUB_WORKSPACE}/.github/scripts`;

            // Contexto da PR JÁ MERGEADA: só os commits deste chamado, inteiros,
            // e o código alterado neles.
            let commits = [], arquivos = [], alteracoes = "", urls = [];
            try {
              const ctx = require(`${scripts}/contexto-resumo-pr.cjs`);
              const todos = (await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 }))
                .map((c) => ({ sha: c.sha, mensagem: c.commit?.message || "", pais: (c.parents || []).length }));
              const doChamado = ctx.commitsDoChamado(todos, m[0]);
              commits = doChamado.map((c) => ctx.mensagemLimpa(c.mensagem)).filter(Boolean);
              const blocos = [];
              for (const c of doChamado) {
                const r = await github.rest.repos.getCommit({ owner, repo, ref: c.sha });
                for (const f of r.data.files || []) blocos.push({ nome: f.filename, patch: f.patch || "" });
              }
              arquivos = [...new Set(blocos.map((b) => b.nome))].slice(0, 300);
              alteracoes = ctx.montarAlteracoes(blocos);
              core.info(`Commits do chamado: ${doChamado.length} de ${todos.length}; arquivos: ${arquivos.length}; código: ${alteracoes.length} caracteres.`);
            } catch (e) { core.warning(`Não deu para montar o contexto da PR: ${e.message}`); }
            try {
              const { urlsDaPr } = require(`${scripts}/rotas-da-pr.cjs`);
              const r = await github.rest.repos.getContent({ owner, repo, path: "src/App.tsx", ref: pr.merge_commit_sha });
              const app = Buffer.from(r.data.content || "", "base64").toString("utf8");
              urls = urlsDaPr(app, arquivos).map((u) => u.url);
            } catch (e) { core.warning(`Não deu para montar as URLs das telas: ${e.message}`); }
            core.info(`URLs das telas: ${urls.join(", ") || "nenhuma"}`);

            try {
              const res = await fetch(`${process.env.SUPABASE_FUNCTIONS_URL}/chamado-concluir-pr`, {
                method: "POST",
                headers: { Authorization: `Bearer ${process.env.CHAMADOS_CI_SECRET}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                  origem: "merge",
                  resumo: true,
                  numero: m[0],
                  pr_url: pr.html_url,
                  pr_titulo: titulo,
                  pr_autor_github: pr.user.login,
                  pr_numero: pr.number,
                  pr_commits: pr.commits ?? null,
                  pr_linhas_adicionadas: pr.additions ?? null,
                  pr_arquivos_alterados: pr.changed_files ?? null,
                  pr_corpo: (pr.body || "").slice(0, 8000),
                  commits, arquivos, urls, alteracoes,
                }),
                // A Edge espera a I.A escrever o resumo.
                signal: AbortSignal.timeout(120000),
              });
              const corpo = await res.text();
              if (!res.ok) {
                core.warning(`chamado-concluir-pr respondeu HTTP ${res.status}: ${corpo}`);
                core.warning("Verifique se 'Verify JWT' está DESLIGADO na function chamado-concluir-pr e se CHAMADOS_CI_SECRET é idêntico no GitHub e no servidor.");
                return;
              }
              core.info(`Resposta: ${corpo}`);
              const j = JSON.parse(corpo);
              if (!j.concluido) core.warning(`Chamado ${m[0]} não está concluído: ${j.motivo || "motivo não informado"}`);
              if (j.resumo) core.info(`Resumo da entrega enviado ao solicitante de ${m[0]}.`);
              else core.warning(`Resumo não enviado: ${j.motivo_resumo || "motivo não informado"}`);
            } catch (e) {
              core.warning(`Não foi possível contatar o serviço de chamados — ${m[0]} (${e.message}).`);
            }
