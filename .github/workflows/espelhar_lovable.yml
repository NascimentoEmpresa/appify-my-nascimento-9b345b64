name: Espelhar main no repositorio do Lovable

# O Lovable nao consegue reconectar a um repositorio existente: a UI dele so
# oferece "criar novo". Entao a fonte da verdade continua sendo este repo (com
# os PRs, os secrets e os workflows de chamado/Discord) e o repo do Lovable
# passa a ser um espelho somente-leitura do main, de onde ele faz o build.
#
# Autenticacao por token, nao por deploy key: a org bloqueia deploy keys
# ("Disabled by NascimentoEmpresa" na pagina de Chaves de implantacao).
#
# IMPORTANTE: nao edite codigo dentro do Lovable. Todo push daqui sobrescreve
# o main de la (force push). Hoje isso e seguro: nenhum dos ultimos 100 commits
# veio do bot do Lovable.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: espelhar-lovable
  cancel-in-progress: false

jobs:
  espelhar:
    runs-on: ubuntu-latest
    # Trava anti-loop: este arquivo tambem e espelhado, e sem isso ele rodaria
    # dentro do proprio espelho tentando empurrar pra si mesmo.
    if: github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'

    steps:
      - name: Checkout do main com historico completo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Empurrar o main para o Lovable
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          # Trocavel sem mexer no codigo: Settings > Secrets and variables >
          # Actions > Variables > LOVABLE_REPO. Se o Lovable criar outro repo,
          # basta atualizar a variavel.
          LOVABLE_REPO: ${{ vars.LOVABLE_REPO || 'NascimentoEmpresa/appify-my-nascimento' }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::Secret MIRROR_TOKEN nao configurado. Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          git remote add lovable "https://x-access-token:${MIRROR_TOKEN}@github.com/${LOVABLE_REPO}.git"
          git push --force lovable main:main
          git remote remove lovable
          echo "main espelhado em ${LOVABLE_REPO} ($(git rev-parse --short HEAD))"
