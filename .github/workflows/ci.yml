name: CI

# Até agora nenhuma PR passava por build, type-check ou teste. Uma PR que
# quebrava o build entrava na main e o Lovable publicava quebrado — aconteceu
# pelo menos três vezes ("remove duplicação de merge que quebrava o build",
# "remove declaração duplicada de empresaCtx", "Destrava o build do Lovable").
#
# O type-check é o passo mais valioso aqui, e por um motivo específico: ele pega
# deterministicamente quase tudo que a regra J4 do REGRAS-PR.md pedia para o
# revisor "rodar mentalmente" — import que não existe (TS2304), declaração
# duplicada (TS2451), tipo que não bate, e resto de conflito de merge, que vira
# erro de sintaxe. Isso sai do julgamento e vira máquina.
#
# Medido na main em 19/08/2026:
#   tsc -p tsconfig.app.json ... 192 erros em 26 arquivos
#   npm test ................... 123 testes, 8 arquivos, 0 falha
#   npm run build .............. passa em 27s
#   npm run lint ............... 2770 problemas (2585 erros)
#
# A primeira linha dizia "tsc --noEmit ... 0 erros" quando este arquivo foi
# escrito, em 18/08. Era falso: sem `-p`, tsc não compila arquivo nenhum neste
# repositório (ver o comentário no job de type-check). O passo mais valioso
# do job era o único que não rodava — e passou despercebido justamente porque
# um check que nunca falha parece um check saudável.
#
# Por isso o lint NÃO trava a PR: travar nele deixaria toda PR vermelha no
# primeiro minuto e o time desligaria o check inteiro na primeira semana. Ele
# roda só nos arquivos que a PR mexeu, como aviso. Ver "Sobre o lint" no fim.
#
# ---------------------------------------------------------------------------
# 02/09/2026 — por que este arquivo deixou de ser um job só
#
# O CI levava 8min30 em QUALQUER PR, até nas de uma linha. Medido pela API do
# GitHub em três execuções seguidas (runs 33640586911, 33638216699 e
# 33636965025), o tempo estava concentrado num passo só:
#
#   Instalar dependências ....... 11-13s
#   Type-check .................. 6min07 a 7min38   <-- 88% do job
#   Testes ...................... 13-17s
#   Build de produção ........... 21-29s
#   Lint ........................ 1s
#
# O type-check é lento por um motivo estrutural, não por descuido. Rodando com
# `--extendedDiagnostics`, o compilador diz onde o tempo vai:
#
#   Parse time ......... 1,93s
#   Bind time .......... 1,00s
#   Check time ....... 770,43s   <-- 99% do total
#   Instantiations ... 100.447.850
#
# Cem milhões de instanciações de tipo. Não é leitura de disco nem parsing: é
# checagem pura. A causa é o `src/integrations/supabase/types.ts` gerado — 663
# KB, 19.696 linhas, 327 tabelas — combinado com as 1.574 chamadas `.from(...)`
# e 291 `.rpc(...)` espalhadas pelo código. Cada uma resolve genérico contra
# aquele tipo gigante. Não é um arquivo lento; são 1.865 chamadas caras.
# Encolher isso mexeria no tipo gerado pelo Supabase, o que é outro projeto.
#
# Então o que mudou aqui foram três coisas que não dependem disso:
#
#   1. O passo agora descobre os arquivos da PR ANTES de chamar o compilador.
#      Na versão anterior o `npx tsc` era a primeira linha do script e o
#      "nenhum arquivo .ts/.tsx alterado, exit 0" vinha DEPOIS dele — ou seja,
#      PR só de migration `.sql` (que aqui é rotina, são 714 delas) gastava os
#      7 minutos inteiros para no fim dizer que não tinha o que checar.
#
#   2. O type-check virou incremental com cache (`.tsbuildinfo`). O tsc guarda
#      os diagnósticos por arquivo; com o estado restaurado ele só re-checa o
#      que a PR mexeu e o que depende disso. Medido na mesma máquina:
#
#        frio (como era) .................... 775s
#        morno, nada mudou ................... 6,1s
#        morno, 1 componente mexido .......... 9,1s
#
#      e os três acham exatamente os mesmos 177 erros — o cache acelera, não
#      afrouxa. A exceção é a PR que mexe em arquivo que quase todo mundo
#      importa (`integrations/supabase/client.ts`, `types.ts`): ali o tsc
#      re-checa quase tudo e o job volta ao tempo cheio. É raro e é correto.
#
#      O cache é semeado por push na main — cache criado dentro de uma PR só é
#      visível para ela mesma, então sem a semeadura o primeiro push de cada
#      PR continuaria frio.
#
#   3. Os quatro passos viraram quatro jobs paralelos. Antes, testes, build e
#      lint ficavam na fila atrás do type-check e só falavam no minuto 8. Agora
#      um build quebrado aparece em ~1 minuto, independente do type-check.
#
# O que NÃO foi feito, de propósito: runner maior (tsc é single-thread, mais
# núcleo não acelera) e `--assumeChangesOnlyAffectDirectDependencies` (acelera
# o incremental deixando passar erro em dependente indireto — trocar corretude
# por segundos é exatamente o que este arquivo existe para não fazer).
# ---------------------------------------------------------------------------

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Push na main não roda testes/build/lint (a main já passou por eles na PR).
  # Serve só para semear o cache do type-check — ver o job `tipos`.
  push:
    branches: [main]

concurrency:
  # Na PR, agrupa pelo número dela; no push da main, pelo ref — senão os dois
  # eventos cairiam no mesmo grupo e um cancelaria o outro.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Um lugar só para a versão do Node, usada pelos quatro jobs.
  NODE_VERSION: '22'

jobs:
  # ==========================================================================
  # Type-check — o job caro. Roda no projeto inteiro (único jeito de enxergar
  # import, alias e tipo entre arquivos) e reprova a PR só se o erro estiver
  # num arquivo que ela mexeu.
  #
  # ATENÇÃO AO COMANDO. `npx tsc --noEmit` sozinho não checa NADA neste
  # repositório: o tsconfig.json da raiz é o "solution file" do Vite, com
  # `"files": []` e apenas `references`, então tsc sem `-p` compila zero
  # arquivo e sai 0. Foi exatamente o que aconteceu quando este workflow
  # nasceu — mediu-se "0 erros" e concluiu-se que estava verde, quando o
  # passo não rodava. Antes de mexer aqui, confirme com:
  #     npx tsc --noEmit --listFiles | grep -c src/
  #
  # E por que só os arquivos da PR: o projeto tem ~180 erros de tipo na base.
  # Travar a PR nesses erros pararia o time inteiro por dívida antiga — mesmo
  # motivo pelo qual o lint não trava.
  # ==========================================================================
  tipos:
    name: tipos
    runs-on: ubuntu-latest
    # Teto de segurança: o pior caso medido é ~8min. Passou de 20, é porque
    # travou — melhor cortar do que segurar o runner pelas 6h do padrão.
    timeout-minutes: 20
    # Mesma trava dos outros workflows: não rodar no espelho do Lovable.
    if: github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # O diff contra a base precisa do histórico.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ------------------------------------------------------------------
      # 04/09/2026 — por que o node_modules virou cache
      #
      # Entre 10:37 e 11:35 de 04/09 o `npm ci` deste repositório passou de
      # 8-12s para 234s, 240s, 306s, 422s e 423s. Não foi mudança nossa: às
      # 11:39 já estava de volta em 12s. O log mostra onde travou — os avisos
      # de pacote depreciado saem todos em 11:30:37 (resolver o lockfile é
      # instantâneo) e a linha seguinte é 11:37:36, "added 699 packages in
      # 7m". Ou seja: sete minutos parados baixando tarball do registry.
      #
      # Naquela janela isso derrubou os quatro jobs de uma vez (cada um roda
      # o seu `npm ci`) e também o workflow de DM do Discord, que instalava
      # 718 pacotes para mandar uma mensagem. O type-check, esse, seguiu em
      # 5-7s o tempo todo — o cache dele não teve nada a ver com o problema.
      #
      # O `cache: npm` do setup-node acima NÃO resolve isso sozinho: ele
      # guarda o ~/.npm (os tarballes baixados), mas o `npm ci` continua
      # apagando e remontando o node_modules e batendo no registry para
      # revalidar. Por isso duas mudanças:
      #
      #   1. Cachear o node_modules pronto, com a chave saindo do
      #      package-lock.json. Com acerto, o `npm ci` nem roda: é extrair um
      #      tar. O registry sai do caminho crítico.
      #   2. Quando erra (lockfile mudou), o `npm ci` roda com
      #      --prefer-offline, que manda o npm usar o que já está no ~/.npm
      #      antes de pedir à rede, e sem --audit/--fund, que são duas idas
      #      ao registry que não servem para nada dentro do CI.
      #
      # Não é imunidade total: registry fora do ar com lockfile novo continua
      # sendo registry fora do ar. É tirar o caso comum da dependência dele.
      #
      # AVISO ESPERADO NO LOG, não é falha: como os quatro jobs rodam juntos
      # e usam a mesma chave, quando o lockfile muda os quatro erram o cache
      # ao mesmo tempo e os quatro tentam gravar. Um consegue; os outros três
      # terminam com "Failed to save: Unable to reserve cache ..., another job
      # may be creating this cache". O cache fica salvo do mesmo jeito
      # (conferido: 76 MB gravados no run 33869808944) e o job segue verde.
      # Evitar o aviso exigiria serializar os jobs, que é justamente o que
      # esta separação em quatro existe para não fazer.
      # ------------------------------------------------------------------
      - name: Cache do node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # O cache guarda o .tsbuildinfo: o estado do compilador (versão de cada
      # arquivo mais os diagnósticos já calculados).
      #
      # São TRÊS buscas, tentadas nesta ordem, e cada linha existe por um motivo:
      #
      #   key           tsc-Linux-<impressao>-<run_id>
      #                 Nunca acerta, de propósito: o run_id é sempre novo. Ela
      #                 existe para o passo de SALVAR gravar uma entrada nova a
      #                 cada execução, em vez de reescrever a mesma.
      #
      #   restore-key 1 tsc-Linux-<impressao>-
      #                 O caso normal: pega o estado mais recente gerado com a
      #                 MESMA versão de TypeScript e as mesmas opções de
      #                 compilador. A impressão digital sai do package-lock.json
      #                 e dos tsconfig*.json.
      #
      #   restore-key 2 tsc-Linux-
      #                 Último recurso, acrescentado em 02/09/2026. Sem ele,
      #                 subir QUALQUER dependência muda a impressão digital, o
      #                 prefixo acima deixa de casar com cache nenhum e todas as
      #                 PRs abertas voltam ao compilador do zero (6-8min) até o
      #                 próximo merge na main re-semear. Com ele, o tsc parte do
      #                 estado mais recente que existir.
      #
      # Por que o último recurso é seguro: o .tsbuildinfo carrega dentro dele a
      # versão do TypeScript e as opções que geraram aquele estado. Se não
      # baterem com as de agora, o próprio tsc descarta e refaz tudo — não é
      # aposta nossa, é conferência do compilador. Os desfechos possíveis são
      # "reaproveita e é rápido" ou "refaz tudo, igual a hoje". Não existe
      # "reaproveita errado e deixa passar um erro" — a medição confirma por
      # outro caminho: frio, morno e morno-com-arquivo-mexido acharam os mesmos
      # 177 erros.
      - name: Restaurar cache do type-check
        uses: actions/cache/restore@v4
        with:
          path: .tsbuildinfo-ci
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.run_id }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-
            tsc-${{ runner.os }}-

      # Baseline da catraca: quantos erros de tipo a main tem. Só restaura (quem
      # grava é o push da main, no fim deste job). Cache escrito na main é
      # visível para as PRs; o escrito numa PR só vale para ela.
      - name: Restaurar o baseline de tipos da main
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: baseline-tipos.txt
          key: baseline-tipos-nunca-acerta
          restore-keys: |
            baseline-tipos-

      - name: Type-check dos arquivos da PR
        id: tsc
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -uo pipefail

          # --------------------------------------------------------------
          # Primeiro descobrir se há o que checar. Chamar o compilador antes
          # disso era o que fazia PR só de .sql custar 7 minutos por nada.
          # No push da main não existe "arquivos da PR": ali o objetivo é só
          # rodar o compilador inteiro e deixar o .tsbuildinfo no cache.
          # --------------------------------------------------------------
          SEMEANDO=0
          if [ "$EVENTO" != "pull_request" ]; then
            SEMEANDO=1
            echo "Push na main: rodando o compilador só para semear o cache."
          else
            ARQUIVOS=$(git diff --name-only --diff-filter=ACM "origin/${BASE}...HEAD" \
              -- '*.ts' '*.tsx' | grep -v '^node_modules/' || true)

            if [ -z "$ARQUIVOS" ]; then
              echo "Nenhum arquivo .ts/.tsx alterado nesta PR."
              echo "Type-check dispensado — nada aqui pode quebrar tipo."
              exit 0
            fi

            printf '%s\n' "$ARQUIVOS" > arquivos-da-pr.txt
            echo "Arquivos .ts/.tsx desta PR:"
            sed 's/^/  /' arquivos-da-pr.txt
            echo
          fi

          # Sinaliza ao passo de salvar que o compilador rodou de verdade. No
          # exit 0 acima ele não roda, e regravar o cache seria só subir de
          # novo, com outra chave, exatamente o mesmo arquivo.
          echo "rodou=true" >> "$GITHUB_OUTPUT"

          mkdir -p .tsbuildinfo-ci

          npx tsc -p tsconfig.app.json --noEmit \
            --incremental --tsBuildInfoFile .tsbuildinfo-ci/app.tsbuildinfo \
            > tsc-saida.txt 2>&1 || true
          TOTAL=$(grep -cE "error TS" tsc-saida.txt || true)

          if [ "$SEMEANDO" = "1" ]; then
            echo "Cache semeado. ($TOTAL erro(s) de tipo na base.)"
            # Publica o número da main como baseline da catraca (ver abaixo).
            # A impressão digital do lockfile vai junto: subir dependência pode
            # mudar a versão do TypeScript e, com ela, a contagem — comparar
            # números feitos por compiladores diferentes reprovaria PR por
            # motivo errado.
            printf '%s %s\n' "$TOTAL" "${{ hashFiles('package-lock.json') }}" > baseline-tipos.txt
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ----------------------------------------------------------------
          # CATRACA (04/11/2026). O gate por arquivo da PR, abaixo, não vê a
          # PR que piora um arquivo que ela NÃO tocou — e isso acontece toda
          # vez que alguém muda o tipo de retorno de um helper usado em 30
          # telas. A dívida antiga continua não sendo cobrada (travar nos ~180
          # erros pararia o time); o que a catraca impede é o número SUBIR.
          # ----------------------------------------------------------------
          if [ -f baseline-tipos.txt ]; then
            BASE_TOTAL=$(cut -d' ' -f1 baseline-tipos.txt)
            BASE_LOCK=$(cut -d' ' -f2 baseline-tipos.txt)
            if [ "$BASE_LOCK" != "${{ hashFiles('package-lock.json') }}" ]; then
              echo "::notice::Catraca de tipos desligada nesta PR: o package-lock mudou, então a contagem da main foi feita com outro compilador."
            elif [ "$TOTAL" -gt "$BASE_TOTAL" ]; then
              echo "::error::Esta PR AUMENTA a dívida de tipos do projeto: a main tem $BASE_TOTAL erro(s) e com esta PR são $TOTAL."
              echo "Isso costuma acontecer quando a mudança altera um tipo usado por outros arquivos — o erro aparece LONGE do que você editou."
              echo "Rode na sua máquina para ver onde: npx tsc -p tsconfig.app.json --noEmit"
              exit 1
            else
              echo "Catraca de tipos: main=$BASE_TOTAL, esta PR=$TOTAL. OK."
            fi
          else
            echo "::notice::Sem baseline de tipos da main (primeira execução ou cache expirado): catraca desligada nesta PR."
          fi

          # Um erro do tsc é a linha "caminho(linha,col): error TSxxxx: ..."
          # seguida de linhas indentadas de detalhe. O awk preserva o bloco
          # inteiro, senão a mensagem chega pela metade e não ajuda ninguém.
          awk 'NR==FNR { muda[$0]=1; next }
               /^[^ \t]/ { arq=$0; sub(/\(.*/, "", arq); mostra=(arq in muda) }
               mostra' arquivos-da-pr.txt tsc-saida.txt > tsc-da-pr.txt

          NOVOS=$(grep -cE "error TS" tsc-da-pr.txt || true)

          echo "Erros de tipo na base inteira: $TOTAL"
          echo "Erros em arquivos desta PR:    $NOVOS"
          echo

          if [ "$NOVOS" -gt 0 ]; then
            cat tsc-da-pr.txt
            echo
            echo "::error::$NOVOS erro(s) de tipo em arquivo que esta PR alterou."
            echo "Algum pode ser anterior à sua mudança — mas o arquivo é seu agora."
            exit 1
          fi

          echo "Nenhum erro de tipo nos arquivos desta PR."

      # `always()` porque o cache vale mesmo quando a PR reprovou: a próxima
      # tentativa aproveita o estado e responde em segundos em vez de minutos.
      # A chave leva o run_id justamente para sempre gravar uma entrada nova; o
      # restore-keys acima é quem faz a execução seguinte achar a mais recente.
      - name: Salvar cache do type-check
        if: always() && steps.tsc.outputs.rodou == 'true'
        uses: actions/cache/save@v4
        with:
          path: .tsbuildinfo-ci
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.run_id }}

      - name: Publicar o baseline de tipos da main
        if: github.event_name == 'push' && steps.tsc.outputs.total != ''
        uses: actions/cache/save@v4
        with:
          path: baseline-tipos.txt
          key: baseline-tipos-${{ github.sha }}

  # ==========================================================================
  # Os três jobs abaixo eram passos que ficavam na fila atrás do type-check.
  # Separados, respondem em ~1 minuto e falam antes.
  # ==========================================================================
  testes:
    name: testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache do node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Instalar dependências do worker para os testes de NFS-e
        run: npm ci --prefix worker --prefer-offline --no-audit --no-fund
      - name: Testes
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache do node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build de produção
        run: npm run build

  # 04/11/2026 — deixou de ser só aviso: virou CATRACA.
  #
  # A lista dos 2.585 erros antigos continua NÃO sendo cobrada (exigir lint
  # limpo hoje deixaria toda PR vermelha e o time desligaria o check). O que
  # mudou é a outra metade, que faltava: o número não pode SUBIR no arquivo que
  # a PR tocou. Quem compara é .github/scripts/catraca-lint.mjs.
  #
  # O lint do repositório inteiro é caro (minutos), então ele roda UMA VEZ por
  # merge, no push da main, e publica o número por arquivo no cache. A PR linta
  # só os arquivos dela e compara. Sem baseline (primeira vez, cache expirado),
  # a catraca se desliga sozinha e o job volta a ser informativo — baseline que
  # falta nunca reprova PR.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # O lint incremental compara a PR com a base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache do node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Restaurar o baseline do lint da main
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: baseline-lint.json
          key: baseline-lint-nunca-acerta
          restore-keys: |
            baseline-lint-

      - name: Lint dos arquivos da PR (catraca)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail

          ARQUIVOS=$(git diff --name-only --diff-filter=ACM "origin/${BASE}...HEAD" \
            -- '*.ts' '*.tsx' | grep -v '^node_modules/' || true)

          if [ -z "$ARQUIVOS" ]; then
            echo "Nenhum arquivo .ts/.tsx alterado nesta PR."
            exit 0
          fi

          echo "Arquivos analisados:"
          echo "$ARQUIVOS" | sed 's/^/  /'
          echo

          # O eslint sai 1 quando acha erro; aqui o que decide é a catraca.
          # shellcheck disable=SC2086
          npx eslint $ARQUIVOS || true
          echo
          # shellcheck disable=SC2086
          npx eslint $ARQUIVOS -f json -o lint-da-pr.json || true

          node .github/scripts/catraca-lint.mjs --atual lint-da-pr.json --baseline baseline-lint.json

      # Uma vez por merge: o número por arquivo do repositório inteiro, que é o
      # baseline das PRs. Caro (minutos) e fora do caminho crítico de quem está
      # esperando revisão — aqui ninguém espera.
      - name: Medir a main e publicar o baseline
        if: github.event_name == 'push'
        run: |
          set -uo pipefail
          npx eslint . -f json -o lint-da-main.json || true
          node .github/scripts/catraca-lint.mjs --resumir lint-da-main.json --para baseline-lint.json

      - name: Guardar o baseline do lint
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: baseline-lint.json
          key: baseline-lint-${{ github.sha }}


  # ---------------------------------------------------------------------
  # Dois arquivos de migration com o MESMO número de versão
  #
  # O aplicador (infra/ha/no-aplicar-migrations.sh) registra por VERSÃO em
  # supabase_migrations.schema_migrations, que tem a versão como chave
  # primária. Com duas migrations no mesmo número, UMA DELAS NUNCA ENTRA NO
  # BANCO — e sem erro nenhum, porque a segunda vê a versão já registrada e
  # considera que não há o que fazer.
  #
  # O aplicador já detecta isso, mas só na hora de aplicar: o merge sai
  # verde, a migration fica no repositório parecendo aplicada, e o problema
  # aparece dias depois, na próxima janela de deploy, com o banco parado no
  # meio da fila. Aconteceu três vezes em dois dias (19 e 20/10/2026, esta
  # última duas vezes seguidas) — sempre o mesmo mecanismo: alguém cria a
  # branch, outro renumera na main, e os dois ficam com o mesmo número.
  #
  # Este job antecipa a mesma checagem para a PR, onde o conserto é um
  # `git mv` e não uma janela de deploy perdida.
  #
  # O CORTE é o mesmo do aplicador e existe pelo mesmo motivo: a base tem
  # 254 pares duplicados de antes de 18/10/2026, herdados da era em que o
  # Lovable gerava o nome. Cobrar a história inteira deixaria TODO merge
  # vermelho — e alarme que nasce sempre ligado vira fita adesiva em cima do
  # alto-falante.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Número de versão repetido
        env:
          # Mesmo valor-padrão de infra/ha/no-aplicar-migrations.sh. Mudar um
          # sem mudar o outro faz a PR passar e o aplicador parar.
          CORTE: '20261018999999'
        run: |
          set -euo pipefail
          DIR=supabase/migrations
          VISTOS=$(mktemp); DUPES=$(mktemp)
          while IFS= read -r -d '' F; do
            B=$(basename "$F")
            case "$B" in [0-9]*) ;; *) continue ;; esac
            V=$(printf '%s' "$B" | sed -E 's/^([0-9]+).*/\1/')
            [ "$V" \> "$CORTE" ] || continue
            printf '%s\n' "$V" >> "$VISTOS"
          done < <(find "$DIR" -maxdepth 1 -name '*.sql' -print0)

          TOTAL=$(wc -l < "$VISTOS" | tr -d ' ')
          LC_ALL=C sort "$VISTOS" | uniq -d > "$DUPES"

          if [ ! -s "$DUPES" ]; then
            echo "OK: $TOTAL migrations acima de $CORTE, nenhum número repetido."
            exit 0
          fi

          echo "::error::Há migrations diferentes com o MESMO número de versão."
          echo
          echo "Uma delas NUNCA entraria no banco, e sem erro nenhum."
          echo
          while read -r V; do
            [ -n "$V" ] || continue
            find "$DIR" -maxdepth 1 -name "${V}_*.sql" -printf '   %f\n'
          done < "$DUPES"
          echo
          echo "Conserto: renomeie com 'git mv' a que chegou depois, para o"
          echo "primeiro número livre. Quem já pode ter entrado no banco"
          echo "mantém o número — confira a data dos commits com:"
          echo "   git log --format='%h %ad %s' --date=short -1 -- <arquivo>"
          exit 1
# ---------------------------------------------------------------------------
# Sobre o lint (atualizado em 04/11/2026)
#
# São ~2585 erros na base inteira, então exigir lint limpo continua inviável —
# e continua NÃO sendo cobrado. O que passou a valer é a catraca: o número de
# erros do arquivo que a PR tocou não pode ficar maior do que o da main. Mesma
# ideia aplicada aos tipos, no job `tipos`.
#
# Por que catraca em vez de meta: "limpar o lint" é um projeto que ninguém
# começa, e enquanto ninguém começa o número cresce. Com a catraca o número só
# pode descer, sem ninguém precisar parar para limpar.
#
# O caminho para exigir lint limpo um dia, se o time quiser:
#   1. `npx eslint . --fix` — resolve ~8 erros e 8 warnings sozinho.
#   2. Atacar as regras por volume, uma PR por regra. A campeã costuma ser
#      @typescript-eslint/no-explicit-any.
#   3. Quando o número chegar perto de zero, trocar a catraca por
#      `npm run lint` puro.
# ---------------------------------------------------------------------------
