name: Qualidade (desempenho)

# ============================================================================
# 03/11/2026 — item 13 da revisão de infraestrutura.
#
# O ci.yml prova que o código COMPILA e que os testes PASSAM. Nada provava que
# ele não derruba a produção: em 03/11/2026 caímos três vezes com código que
# compilava e passava em tudo (post-mortem em docs/incidentes/). Este workflow
# é o "QA que a empresa não tem", em dois jobs que reprovam a PR:
#
#   guardiao ........ regras determinísticas sobre as linhas ADICIONADAS
#                     (.github/scripts/guardiao-desempenho.mjs): polling,
#                     Realtime, lista sem limite em tabela grande, select * em
#                     tabela grande, Promise.all de N requisições, policy com
#                     função por linha, FK sem índice, SECURITY DEFINER sem
#                     search_path. Rodado para trás nos commits que causaram
#                     as quedas, ele teria barrado os três (ver o doc).
#
#   qa-requisicoes .. abre TODAS as telas da build da PR num navegador com a
#                     API simulada, adianta o relógio em 10 minutos e reprova
#                     a tela que buscar algo sozinha ou que gastar mais de 60
#                     requisições para abrir (infra/qa/orcamento-requisicoes.mjs).
#                     Não toca na produção.
#
# Para valer de verdade, os dois precisam ser OBRIGATÓRIOS na main:
# Settings → Branches → main → Require status checks → "guardiao" e
# "qa-requisicoes" (passo a passo em docs/infra/pipeline-qualidade.md).
# ============================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Push na main não reprova nada (a main já passou por isto na PR): serve só
  # para MEDIR as telas da main e publicar o número de cada uma como baseline
  # da catraca (ver o job qa-requisicoes). Sem esta semeadura, PR nenhuma teria
  # com o que comparar: cache criado dentro de uma PR só é visível para ela.
  push:
    branches: [main]

concurrency:
  group: qualidade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  guardiao:
    name: guardiao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Regras de desempenho nas linhas que a PR adiciona
        run: node .github/scripts/guardiao-desempenho.mjs --base origin/${{ github.base_ref }}

  qa-preparar:
    name: Preparar build do QA
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'
    permissions:
      contents: read
    outputs:
      executar: ${{ steps.mexe.outputs.sim }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # PR só de migration/doc não muda o comportamento da tela: não gasta 10 min.
      # No push da main roda sempre: é a medição que vira baseline.
      - name: A PR mexe no frontend?
        id: mexe
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
            echo "Push na main: medindo as telas para publicar o baseline da catraca."
          else
            git diff --name-only origin/${{ github.base_ref }}...HEAD > arquivos-qa.txt
            if grep -Eq '^(src/|public/|infra/qa/|index\.html$|vite\.config\.|package(-lock)?\.json$|\.github/workflows/qualidade\.yml$|\.github/tabelas-grandes\.json$)' arquivos-qa.txt; then
              echo "sim=1" >> "$GITHUB_OUTPUT"
            else
              echo "PR sem mudança de frontend — QA de requisições não se aplica." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.mexe.outputs.sim
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Provar divisão e consolidação das telas
        if: steps.mexe.outputs.sim
        run: node --test infra/qa/fatias.test.mjs
      - name: Cache do node_modules
        if: steps.mexe.outputs.sim
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências
        if: steps.mexe.outputs.sim && steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # A build aponta para uma API que NÃO existe: o teste intercepta tudo.
      # Se algum dia uma requisição escapar da interceptação, ela falha em vez
      # de ir para a produção.
      - name: Build apontando para a API falsa
        if: steps.mexe.outputs.sim
        env:
          VITE_SUPABASE_URL: https://api.qa.invalid
          VITE_SUPABASE_ANON_KEY: qa
        run: npm run build

      - name: Compartilhar a mesma build entre as fatias
        if: steps.mexe.outputs.sim
        uses: actions/upload-artifact@v4
        with:
          name: build-qa
          path: dist
          if-no-files-found: error
          retention-days: 1

  # 06/11/2026: no run 42315466250, --with-deps gastou 3min53s baixando
  # FONTES do Ubuntu. As bibliotecas do Chromium já existem no runner 24.04.
  # Instalamos só o headless shell, sem apt, com versão presa no lock próprio.
  # Três runners dividem TODAS as rotas; não aumentamos a disputa por CPU no
  # mesmo runner nem encurtamos os 10 minutos simulados de observação.
  qa-telas:
    name: QA de telas (${{ matrix.fatia }}/3)
    needs: qa-preparar
    if: needs.qa-preparar.outputs.executar == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fatia: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/qa/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: build-qa
          path: dist
      - name: Restaurar dependências da build (Vite preview)
        id: node-modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências se o cache expirou
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache isolado do Playwright e do Chromium
        id: playwright
        uses: actions/cache@v4
        with:
          path: |
            infra/qa/node_modules
            ~/.cache/ms-playwright
          key: qa-pw-${{ runner.os }}-${{ runner.arch }}-ubuntu24-node${{ env.NODE_VERSION }}-${{ hashFiles('infra/qa/package-lock.json') }}
      - name: Instalar Playwright sem alterar as dependências do ERP
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npm ci --prefix infra/qa --prefer-offline --no-audit --no-fund
      - name: Instalar somente Chromium headless
        run: node infra/qa/node_modules/playwright/cli.js install --only-shell chromium
      - name: Restaurar o baseline da main
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: orcamento-main.json
          key: orcamento-main-nunca-acerta
          restore-keys: |
            orcamento-main-

      - name: Abrir cada tela e contar requisições
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173/ >/dev/null
          CATRACA=()
          [ ! -f orcamento-main.json ] || CATRACA=(--baseline orcamento-main.json)
          node infra/qa/orcamento-requisicoes.mjs \
            --base http://127.0.0.1:4173 --paralelo 4 --fatia ${{ matrix.fatia }}/3 \
            --saida orcamento.json "${CATRACA[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orcamento-fatia-${{ matrix.fatia }}
          path: orcamento.json
          if-no-files-found: error
          retention-days: 14

  # Este nome é obrigatório na proteção da main. Sucesso só depois das três
  # fatias verdes E da conferência de cobertura (sem rota faltando/repetida).
  qa-requisicoes:
    name: qa-requisicoes
    needs: [qa-preparar, qa-telas]
    if: always() && github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Conferir se todos os jobs terminaram corretamente
        env:
          PREPARACAO: ${{ needs.qa-preparar.result }}
          EXECUTAR: ${{ needs.qa-preparar.outputs.executar }}
          TELAS: ${{ needs.qa-telas.result }}
        run: |
          [ "$PREPARACAO" = success ]
          if [ "$EXECUTAR" = 1 ]; then
            [ "$TELAS" = success ]
          else
            [ "$TELAS" = skipped ]
            echo "PR sem mudança de frontend — QA de requisições não se aplica." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v6
        if: needs.qa-preparar.outputs.executar == '1'
      - uses: actions/setup-node@v4
        if: needs.qa-preparar.outputs.executar == '1'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        if: needs.qa-preparar.outputs.executar == '1'
        with:
          pattern: orcamento-fatia-*
          path: orcamentos
      - name: Conferir cobertura e juntar os resultados
        if: needs.qa-preparar.outputs.executar == '1'
        run: node infra/qa/juntar-orcamentos.mjs orcamentos/*/orcamento.json
      - uses: actions/upload-artifact@v4
        if: needs.qa-preparar.outputs.executar == '1'
        with:
          name: orcamento-requisicoes
          path: orcamento.json
          if-no-files-found: error
          retention-days: 14

      # Publica o resultado da main como BASELINE da catraca por tela. Cache
      # escrito na main é visível para todas as PRs; cache escrito numa PR só
      # vale para ela — por isso a semeadura precisa ser aqui.
      - name: Preparar o baseline (só na main)
        if: github.event_name == 'push' && needs.qa-preparar.outputs.executar == '1'
        run: cp orcamento.json orcamento-main.json

      - name: Publicar o baseline da main
        if: github.event_name == 'push' && needs.qa-preparar.outputs.executar == '1'
        uses: actions/cache/save@v4
        with:
          # MESMO caminho do restore na PR: cache guarda o caminho literal.
          path: orcamento-main.json
          key: orcamento-main-${{ github.sha }}

  # ==========================================================================
  # A migration RODA antes do merge (04/11/2026)
  #
  # Até hoje uma migration era LIDA por regex (M1–M6 do guardião) e aplicada
  # DIRETO NA PRODUÇÃO no merge (cluster_pos_merge.yml). Entre as duas coisas
  # não existia nenhuma execução de verdade — e, como o aplicador roda uma
  # transação por arquivo e para no primeiro erro, uma migration que não roda
  # não é problema de quem a escreveu: é a fila do time inteiro parada, com o
  # banco no meio do caminho e a R4 (append-only) proibindo consertar o
  # arquivo.
  #
  # O QUE ESTE JOB PROVA: que o Postgres 18 ACEITA o texto. Erro de sintaxe,
  # resto de conflito de merge, `CREATE OR REPLACE TRIGGER`, dólar-quote não
  # fechado, âncora quebrada por CRLF — tudo isso aparece aqui, em 40 s, em vez
  # de aparecer no merge.
  #
  # O QUE ELE NÃO PROVA: que a migration faz a coisa certa no schema de
  # verdade. O banco do runner nasce VAZIO (as 1.247 migrations não aplicam do
  # zero: o schema real divergiu do repositório), então erro de "tabela não
  # existe" é esperado e NÃO reprova — só erro de sintaxe/recurso inexistente
  # reprova. Para o ensaio completo falta um dump só de schema da produção
  # publicado todo dia; isso depende de um subcomando novo na chave restrita
  # do cluster (hoje ela só aceita `functions` e `migrations`), que é mudança
  # nos nós, não no CI. Está anotado em docs/infra/pipeline-qualidade.md §5.
  #
  # Por que sem ON_ERROR_STOP: assim o psql reporta TODOS os erros do arquivo
  # em vez de parar no primeiro. Com ele, um "tabela não existe" na linha 3
  # esconderia o erro de sintaxe da linha 90.
  # ==========================================================================
  migracao-roda:
    name: migracao-roda
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64'
    permissions:
      contents: read
    services:
      pg:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: prova
          POSTGRES_DB: prova
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Quais migrations esta PR traz?
        id: novas
        run: |
          set -uo pipefail
          BASE="origin/${{ github.base_ref || 'main' }}"
          git diff --name-only --diff-filter=AM "$BASE...HEAD" -- 'supabase/migrations/*.sql' > novas.txt || true
          if [ ! -s novas.txt ]; then
            echo "PR sem migration nova — nada a aplicar." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "tem=1" >> "$GITHUB_OUTPUT"
          echo "Migrations desta PR:"; sed 's/^/  /' novas.txt

      - name: Instalar o psql 18
        if: steps.novas.outputs.tem
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # 10/11/2026: a PR #1185 caiu aqui com "curl: (56) Failure when
          # receiving data from the peer" — queda de rede do runner, não da PR.
          # Tenta de novo sozinho em vez de reprovar a PR.
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq postgresql-client-18

      - name: Provar fila NFS-e e separação de produção em PostgreSQL 18
        if: steps.novas.outputs.tem
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: prova
        run: |
          set -euo pipefail
          if ! grep -q 'sis_2026_0841_nfse_producao.sql' novas.txt; then exit 0; fi
          createdb nfse_0841_teste
          psql -d nfse_0841_teste -v ON_ERROR_STOP=1 -f worker/test/nfse-producao.sql

      - name: Aplicar cada migration e separar erro de sintaxe de erro de schema
        if: steps.novas.outputs.tem
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: prova
          PGDATABASE: prova
        run: |
          set -uo pipefail

          # Os papéis que as migrations do projeto mencionam. Sem eles, GRANT e
          # policy falhariam por motivo que não é defeito da migration.
          psql -q -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            CREATE ROLE anon NOLOGIN;            EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE authenticated NOLOGIN;   EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE service_role NOLOGIN;    EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE authenticator NOINHERIT; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE SCHEMA IF NOT EXISTS extensions;
          SQL

          # Códigos que são DEFEITO DO ARQUIVO, em qualquer banco:
          #   42601 syntax_error        texto que o Postgres não entende
          #   0A000 feature_not_supported   ex.: CREATE OR REPLACE TRIGGER
          #   42P13 invalid_function_definition
          # O resto (42P01 tabela não existe, 42883 função não existe, 3F000
          # schema, 42703 coluna, 58P01 extensão que o runner não tem) é
          # consequência de o banco nascer vazio, não defeito do arquivo.
          FATAIS='42601|0A000|42P13'
          FALHOU=0
          : > achados.txt

          while IFS= read -r ARQ; do
            [ -n "$ARQ" ] || continue
            echo "::group::$ARQ"
            # VERBOSITY=verbose faz o psql imprimir o SQLSTATE junto do erro,
            # que é o que permite separar "defeito" de "banco vazio".
            psql -v VERBOSITY=verbose -f "$ARQ" > saida.txt 2>&1 || true
            grep -E '^psql:.*(ERROR|FATAL)' saida.txt | sed 's/^/  /' || echo "  sem erro nenhum."
            if grep -qE "^psql:.*(ERROR|FATAL):  ($FATAIS):" saida.txt; then
              FALHOU=1
              LINHA=$(grep -E "^psql:.*(ERROR|FATAL):  ($FATAIS):" saida.txt | head -3)
              printf -- '- `%s`\n```\n%s\n```\n' "$ARQ" "$LINHA" >> achados.txt
              echo "::error file=$ARQ::O Postgres 18 não aceita este arquivo. $(echo "$LINHA" | head -1)"
            fi
            echo "::endgroup::"
          done < novas.txt

          {
            echo "## A migration roda?"
            if [ "$FALHOU" = "1" ]; then
              echo "❌ **O Postgres recusou o texto de pelo menos uma migration.** Mergeada assim, ela PARA A FILA de aplicação do time inteiro."
              echo
              cat achados.txt
            else
              echo "✅ O Postgres 18 aceitou o texto de todas as migrations desta PR."
              echo
              echo "_Erro de \"não existe\" no log é esperado: o banco do runner nasce vazio. Este job prova a sintaxe, não o efeito no schema real._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $FALHOU
