name: Revisão de PR por IA

# Terceira trava da main, ao lado de validar-chamado (título com chamado) e do
# ruleset que exige 1 aprovação humana. Esta olha o CONTEÚDO do diff.
#
# Duas camadas, de propósito:
#   portaria   — script determinístico, regras absolutas (segredo, DROP TABLE,
#                RLS desabilitada). Nunca falha aberto.
#   revisao-ia — Claude lendo .github/REGRAS-PR.md. Julgamento: RLS que vaza
#                linha, menu que nasce aberto, filtro de empresa faltando.
#
# Regra absoluta não fica no julgamento do modelo. Um modelo acerta quase
# sempre, e "quase sempre" não serve para chave vazada.
#
# pull_request (não pull_request_target): precisamos do CÓDIGO da PR, e fazer
# checkout do head sob pull_request_target num repositório público entrega os
# secrets para qualquer um que abra uma PR de fork. O preço dessa escolha é
# que PR de fork não recebe o secret e o check falha — que é o comportamento
# certo: fork vira revisão humana. Não afeta o time, que trabalha em branches
# deste repositório.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Push novo cancela a revisão anterior da mesma PR. Sem isso, uma sequência de
# commits gasta a cota da assinatura revisando código que já foi substituído.
concurrency:
  group: revisao-ia-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Vira required status check junto com revisao-ia. Precisa ser os DOIS: um
  # job pulado conta como sucesso na proteção de branch, então se só revisao-ia
  # fosse obrigatório, uma reprovação da portaria (que pula o job seguinte)
  # deixaria o merge liberado.
  portaria:
    name: portaria
    runs-on: ubuntu-latest
    # Mesma válvula de escape da label sem-chamado que já existe no repo.
    if: >-
      github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64' &&
      !contains(github.event.pull_request.labels.*.name, 'pular-revisao-ia')
    permissions:
      contents: read
      # Necessário para comentar a reprovação na PR (step abaixo).
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # As regras comparam a PR com a base; sem histórico o merge-base não
          # existe e o script aborta com mensagem explicando isso.
          fetch-depth: 0

      - name: Aplicar regras absolutas (R1–R8)
        id: regras
        env:
          # Título via env, nunca interpolado no shell: é texto de terceiros.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/portaria-pr.mjs

      # Quando a portaria reprova, o job seguinte (revisao-ia) é pulado por
      # `needs`, então NINGUÉM comenta na PR: o autor vê só um check vermelho e
      # precisa entrar em Checks → Details → logs para descobrir o motivo. Este
      # step fecha esse buraco — a explicação e o passo para destravar vão para
      # a aba Conversation, que é onde as pessoas olham.
      - name: Explicar a reprovação na PR
        if: failure() && steps.regras.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          [ -f portaria-comentario.md ] || exit 0
          {
            echo "<!-- revisao-ia -->"
            cat portaria-comentario.md
            echo
            echo "---"
            echo "_Regras em \`.github/REGRAS-PR.md\`. Rode \`npm run revisar\` na sua máquina para conferir antes de subir._"
          } > comentario.md
          gh pr comment "$PR" --edit-last --create-if-none --body-file comentario.md \
            || gh pr comment "$PR" --body-file comentario.md

  revisao-ia:
    name: revisao-ia
    needs: portaria
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'NascimentoEmpresa/appify-my-nascimento-9b345b64' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'pular-revisao-ia')
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Diff preparado aqui, e não pelo modelo, por duas razões: o filtro de
      # arquivo fica auditável no YAML, e o corte de tamanho é garantido em vez
      # de depender do modelo se comportar.
      - name: Preparar o diff
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          LIMITE=150000  # ~40k tokens; segura o consumo da assinatura

          git diff "origin/${BASE}...HEAD" -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)bun.lockb' \
            ':(exclude)dist/**' \
            ':(exclude)**/*.xlsx' ':(exclude)**/*.xls' ':(exclude)**/*.csv' \
            ':(exclude)**/*.png' ':(exclude)**/*.jpg' ':(exclude)**/*.jpeg' \
            ':(exclude)**/*.gif' ':(exclude)**/*.webp' ':(exclude)**/*.pdf' \
            ':(exclude)**/*.zip' ':(exclude)**/*.woff' ':(exclude)**/*.woff2' \
            > diff-completo.txt || true

          TAMANHO=$(wc -c < diff-completo.txt)
          if [ "$TAMANHO" -gt "$LIMITE" ]; then
            head -c "$LIMITE" diff-completo.txt > diff-da-pr.txt
            printf '\n\n[DIFF CORTADO: %s de %s bytes. Revise o que veio e diga no comentário que a PR excedeu o limite de revisão automática.]\n' \
              "$LIMITE" "$TAMANHO" >> diff-da-pr.txt
          else
            cp diff-completo.txt diff-da-pr.txt
          fi
          echo "Diff preparado: $TAMANHO bytes brutos."

          # Diff vazio pula o modelo por completo. Sem esta trava o revisor
          # inventa: na primeira execução real o diff veio vazio (a PR tinha
          # acabado de ser mergeada) e ele produziu um APROVADO deduzido do
          # título e dos arquivos do repositório, sem ter lido mudança
          # nenhuma. Em modo bloqueio isso seria um carimbo automático.
          # Acontece de verdade quando a PR só toca arquivo excluído do filtro.
          if [ -s diff-da-pr.txt ]; then
            echo "vazio=false" >> "$GITHUB_OUTPUT"
          else
            echo "vazio=true" >> "$GITHUB_OUTPUT"
            echo "Nenhum arquivo revisável no diff — a revisão por IA será pulada."
          fi

      - name: Revisar
        id: claude
        if: steps.diff.outputs.vazio != 'true'
        # Falha da ação não derruba o job: quem decide o resultado é o step
        # seguinte, que distingue "modelo reprovou" de "infra caiu".
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # Duas credenciais aceitas, com a chave de API tendo precedência
          # quando existir. Motivo: a assinatura pessoal não sustenta uso de
          # equipe — quando o dono do token usa o Claude, o revisor para de
          # funcionar para todo mundo, e falha silenciosa (check verde, revisão
          # nenhuma). Aconteceu de verdade na PR #374.
          #
          # A troca é só cadastrar o secret ANTHROPIC_API_KEY em Settings →
          # Secrets and variables → Actions. Não precisa de PR: com os dois
          # presentes a ação usa a chave de API; sem ela, continua na
          # assinatura. Cobrança da API é crédito pré-pago no
          # console.anthropic.com, separada da assinatura Pro.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Write"
          prompt: |
            Você é o revisor automático de PR deste repositório.

            Leia `.github/REGRAS-PR.md` — ele tem o contexto do projeto e as
            regras. Depois leia `diff-da-pr.txt`, que é o diff desta PR já
            filtrado. Use Read/Grep/Glob para abrir os arquivos ao redor
            sempre que precisar entender o que uma mudança faz.

            Título da PR: ${{ github.event.pull_request.title }}

            As regras absolutas R1–R8 já foram verificadas por um script e
            passaram. Não gaste esforço nelas. Seu trabalho são as regras de
            julgamento J1–J8.

            Comece por J1, que é o maior gargalo do projeto: liberar um módulo
            no Gerenciamento de Acesso e o usuário continuar sem ver nada,
            resolvendo só com "Administrador Geral". São seis causas distintas
            (J1.A a J1.F) e você precisa percorrer as seis, não a primeira que
            parecer se aplicar.

            Produza exatamente dois arquivos na raiz do repositório:

            1. `revisao.md` — o comentário que vai para a PR, seguindo as
               quatro partes de "Como escrever o comentário" no REGRAS-PR.md:
               resumo e veredito, aviso de migration quando houver, a tabela de
               conferência, e os achados.

               A tabela de conferência é OBRIGATÓRIA mesmo quando não há
               achado nenhum — é ela que mostra que você percorreu as regras
               em vez de assumir. Preencha todas as linhas, usando "não se
               aplica" com o motivo em vez de só "ok". Fora a tabela, seja
               breve: prosa longa em PR boa treina o time a ignorar revisão.

            2. `veredito.json` — exatamente neste formato, sem mais nada:
               {"veredito":"APROVADO","achados":0,"resumo":"uma linha"}
               O campo veredito é APROVADO, AJUSTES ou BLOQUEADO, conforme a
               tabela no fim do REGRAS-PR.md.

            Na dúvida entre AJUSTES e APROVADO, escolha APROVADO e deixe a
            ressalva escrita no comentário. Existe revisor humano depois de
            você, e um falso positivo custa mais confiança do que um achado a
            menos.

            Uma coisa que você não deve fazer em hipótese alguma: se
            `diff-da-pr.txt` estiver vazio ou não contiver linhas de mudança
            de verdade, NÃO deduza a revisão a partir do título da PR nem
            lendo os arquivos do repositório. Escreva o veredito
            {"veredito":"AJUSTES","achados":0,"resumo":"Diff vazio — nada foi
            revisado"} e diga isso no comentário. Aprovar sem ter lido
            mudança nenhuma é pior do que não revisar.

      # Comentário postado pelo shell, não pelo modelo: assim o comentário sai
      # mesmo que o modelo tenha terminado de um jeito estranho, e o formato
      # sticky (editar o anterior em vez de empilhar) fica garantido.
      #
      # SEMPRE posta algo, mesmo quando a revisão não rodou. Antes, quando
      # não havia revisao.md, o step só dava exit 0 e a PR ficava sem
      # comentário nenhum — quem olhasse a aba Conversation via só "checks
      # passaram" e não tinha como saber que a IA nem chegou a rodar. O aviso
      # existia, mas só no log da Action, que ninguém lê por padrão.
      - name: Publicar a revisão na PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          DIFF_VAZIO: ${{ steps.diff.outputs.vazio }}
          CLAUDE_RESULTADO: ${{ steps.claude.outcome }}
        run: |
          set -uo pipefail

          if [ -f revisao.md ]; then
            cat revisao.md > corpo.md
          elif [ "${DIFF_VAZIO:-false}" = "true" ]; then
            cat > corpo.md <<'MSG'
          ## Revisão não rodou — nada a revisar

          Esta PR não tem arquivo revisável no diff: ou ela só toca arquivos
          fora do filtro (planilhas, imagens, lockfiles), ou o conteúdo é
          idêntico ao da branch base. As regras absolutas (portaria) já
          rodaram normalmente e valem independente disso.
          MSG
          else
            # O motivo real está no JSON que a ação grava. Sem ler esse arquivo
            # o comentário vira uma lista de palpites, e o autor persegue a
            # causa errada — foi o que aconteceu na PR do Pablo, onde a cota
            # tinha acabado mas o texto mandava conferir o secret primeiro.
            EXEC="${RUNNER_TEMP}/claude-execution-output.json"
            CAUSA="desconhecida"
            if [ -f "$EXEC" ]; then
              CUSTO=$(node -e "try{const r=require('$EXEC');const x=Array.isArray(r)?r.find(e=>e.type==='result'):r;console.log(x?.total_cost_usd??'')}catch(e){console.log('')}" 2>/dev/null || echo "")
              TURNOS=$(node -e "try{const r=require('$EXEC');const x=Array.isArray(r)?r.find(e=>e.type==='result'):r;console.log(x?.num_turns??'')}catch(e){console.log('')}" 2>/dev/null || echo "")
              # Custo zero com 1 turno = rejeitado antes de ler qualquer coisa.
              # Uma revisão de verdade sempre consome tokens e gasta vários turnos.
              if [ "$CUSTO" = "0" ] && [ "$TURNOS" = "1" ]; then CAUSA="credencial"; fi
            fi

            if [ "$CAUSA" = "credencial" ]; then
              cat > corpo.md <<MSG
          ## Revisão não rodou — cota ou credencial

          A execução foi rejeitada **antes de ler o diff**: custo zero e apenas
          1 turno. Isso não é erro de revisão, é recusa na porta.

          A causa quase certa é **cota da assinatura esgotada**. O revisor usa a
          assinatura Claude Pro pessoal do Eduardo, então quando ele está usando
          o Claude, o revisor para de funcionar para o time inteiro. Menos
          provável: o secret \`CLAUDE_CODE_OAUTH_TOKEN\` expirou.

          **Isto é um problema de infraestrutura, não da sua PR.** Chame o
          Eduardo — a solução definitiva é migrar para uma chave de API própria,
          que não compete com o uso pessoal de ninguém.

          As regras absolutas (portaria) rodaram normalmente e valem
          independente disso — só a parte de julgamento (IA) ficou de fora.
          MSG
            else
              cat > corpo.md <<MSG
          ## Revisão não rodou nesta execução

          Causa mais provável: **esta PR altera o próprio \`revisao_ia.yml\`**. A
          ação se recusa a rodar quando o workflow da PR difere do que está na
          \`main\` — proteção contra PR que tenta alterar o workflow para vazar o
          token. É esperado, e some sozinho quando a PR entrar na main.

          Se esta PR **não** mexe nesse arquivo, veja a linha \`##[warning]\` do
          step **Revisar** no log desta execução. Resultado da ação:
          \`$CLAUDE_RESULTADO\`.

          As regras absolutas (portaria) rodaram normalmente e valem
          independente disso — só a parte de julgamento (IA) ficou de fora.
          MSG
            fi
          fi

          {
            echo "<!-- revisao-ia -->"
            cat corpo.md
            echo
            echo "---"
            echo "_Revisão automática — regras em \`.github/REGRAS-PR.md\`. Para pular, use a label \`pular-revisao-ia\`._"
          } > comentario.md
          gh pr comment "$PR" --edit-last --create-if-none --body-file comentario.md \
            || gh pr comment "$PR" --body-file comentario.md

      - name: Aplicar o veredito
        if: always()
        env:
          # Interruptor do rollout. Ausente ou "false" → modo aviso: comenta
          # mas nunca fica vermelho. Ligar a Fase 2 é criar esta variable com
          # "true" em Settings → Secrets and variables → Actions → Variables,
          # sem precisar de PR nova.
          BLOQUEIA: ${{ vars.REVISAO_IA_BLOQUEIA }}
          CLAUDE_RESULTADO: ${{ steps.claude.outcome }}
          DIFF_VAZIO: ${{ steps.diff.outputs.vazio }}
        run: |
          set -uo pipefail

          if [ "${DIFF_VAZIO:-false}" = "true" ]; then
            echo "::notice::Nada a revisar: o diff não tem arquivo revisável (só arquivos fora do filtro, ou a branch não mudou em relação à base)."
            exit 0
          fi

          if [ ! -f veredito.json ]; then
            # Sem veredito não dá para saber se o código está bom. Falha ABERTO,
            # igual ao chamado_pr_sync.yml faz quando o Supabase não responde:
            # instabilidade nossa não pode travar merge de toda a empresa.
            echo "::warning::A revisão por IA não produziu veredito (resultado da ação: $CLAUDE_RESULTADO). Passando o check para não travar a PR — revise à mão. O motivo foi explicado num comentário na própria PR."
            exit 0
          fi

          VEREDITO=$(node -p "JSON.parse(require('fs').readFileSync('veredito.json','utf8')).veredito || 'DESCONHECIDO'")
          RESUMO=$(node -p "JSON.parse(require('fs').readFileSync('veredito.json','utf8')).resumo || ''")
          echo "Veredito: $VEREDITO — $RESUMO"

          if [ "$VEREDITO" = "APROVADO" ]; then
            echo "Revisão aprovada."
            exit 0
          fi

          if [ "${BLOQUEIA:-false}" != "true" ]; then
            echo "::warning::Veredito $VEREDITO. Modo aviso ativo, então o check passa mesmo assim."
            echo "::warning::Para bloquear merge nestes casos, defina a variable REVISAO_IA_BLOQUEIA=true."
            exit 0
          fi

          echo "::error::Revisão reprovou com veredito $VEREDITO. Veja o comentário na PR."
          exit 1
