# ============================================================================
#  Replica de failover do ERP na Render
# ============================================================================
#
#  O QUE ESTE ARQUIVO E
#  A Render nao roda docker-compose: la cada container e um servico proprio.
#  Este arquivo (um "Blueprint") descreve os seis de uma vez, para nao ser
#  preciso preencher seis formularios a mao e correr o risco de esquecer uma
#  variavel - foi exatamente uma variavel esquecida (GOTRUE_JWT_AUD) que fez
#  todos os 154 usuarios receberem "credenciais invalidas" no ensaio local.
#
#  COMO USAR
#  No painel da Render: New > Blueprint > escolher este repositorio.
#  Ela le este arquivo, mostra os seis servicos e pede os segredos marcados
#  abaixo com `sync: false`. Nada e cobrado ate voce confirmar.
#
#  DE ONDE SAEM OS SEGREDOS
#  Rode `node infra/failover/gerar-chaves.mjs` e use os valores do .env gerado.
#  As chaves precisam ser COERENTES entre si (anon e service_role sao assinadas
#  com o JWT_SECRET); gerar na mao, separado, nao funciona.
#
#  CUSTO ESTIMADO: ~US$ 57/mes (5 servicos Starter + 1 Standard + 2 discos).
#  A conta esta aberta no README desta pasta, junto com a alternativa.
#
#  REGIAO: virginia (US-East). A Render nao tem datacenter na America do Sul;
#  virginia e a mais proxima do Brasil. Os seis servicos PRECISAM ficar na
#  mesma regiao: so assim eles se enxergam na rede privada da Render. Um
#  servico em outra regiao simplesmente nao resolve o endereco dos outros.
#
#  AUTO SYNC: recomendo deixar DESLIGADO no painel. Ligado, todo push na
#  branch faz a Render reimplantar - inclusive durante um incidente, que e
#  justamente quando ninguem quer surpresa.
# ============================================================================
services:

  # --- banco ----------------------------------------------------------------
  # Privado: nao tem endereco publico, so os outros servicos o alcancam.
  # Standard (2 GB) e o minimo com folga: a instancia Micro da Supabase (1 GB)
  # ja CAIU restaurando este mesmo banco, em 29/09/2026.
  - name: erp-db
    type: pserv
    runtime: docker
    plan: standard
    region: virginia
    dockerfilePath: ./infra/failover/render/Dockerfile.db
    dockerContext: .
    autoDeploy: false
    disk:
      name: dados
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
    envVars:
      - key: POSTGRES_PASSWORD
        sync: false            # do .env gerado por gerar-chaves.mjs
      - key: POSTGRES_DB
        value: postgres

  # --- API (PostgREST) ------------------------------------------------------
  # E quem aplica as 1.445 policies de RLS. Conecta como `authenticator` e
  # troca de papel conforme o token que recebe.
  - name: erp-rest
    type: pserv
    runtime: image
    plan: starter
    region: virginia
    image:
      url: docker.io/postgrest/postgrest:v12.2.3
    envVars:
      - key: PGRST_DB_URI
        sync: false            # postgres://authenticator:<SENHA>@<host do erp-db>:5432/postgres
      - key: PGRST_DB_SCHEMAS
        value: public,storage
      - key: PGRST_DB_ANON_ROLE
        value: anon
      - key: PGRST_JWT_SECRET
        sync: false
      - key: PGRST_DB_USE_LEGACY_GUCS
        value: "false"
      - key: PGRST_SERVER_PORT
        value: "3000"

  # --- login (GoTrue) -------------------------------------------------------
  - name: erp-auth
    type: pserv
    runtime: image
    plan: starter
    region: virginia
    image:
      url: docker.io/supabase/gotrue:v2.158.1
    envVars:
      - key: GOTRUE_API_HOST
        value: 0.0.0.0
      - key: GOTRUE_API_PORT
        value: "9999"
      - key: GOTRUE_DB_DRIVER
        value: postgres
      - key: GOTRUE_DB_DATABASE_URL
        sync: false            # postgres://supabase_auth_admin:<SENHA>@<host do erp-db>:5432/postgres
      - key: GOTRUE_JWT_SECRET
        sync: false
      - key: GOTRUE_JWT_EXP
        value: "3600"
      - key: GOTRUE_JWT_DEFAULT_GROUP_NAME
        value: authenticated
      # SEM ESTA LINHA NENHUM DOS 154 USUARIOS ENTRA. O GoTrue procura o
      # usuario por e-mail E audiencia; os restaurados tem aud='authenticated'
      # e, sem isto, ele procura audiencia vazia e responde
      # "Invalid login credentials" para todo mundo. Parece senha errada.
      - key: GOTRUE_JWT_AUD
        value: authenticated
      - key: GOTRUE_DISABLE_SIGNUP
        value: "true"
      - key: GOTRUE_MAILER_AUTOCONFIRM
        value: "true"
      - key: GOTRUE_EXTERNAL_EMAIL_ENABLED
        value: "true"
      - key: API_EXTERNAL_URL
        sync: false            # a URL publica do erp-kong
      - key: GOTRUE_SITE_URL
        sync: false            # onde o ERP e servido (a Vercel, por exemplo)
      - key: GOTRUE_URI_ALLOW_LIST
        sync: false

  # --- arquivos -------------------------------------------------------------
  - name: erp-storage
    type: pserv
    runtime: image
    plan: starter
    region: virginia
    image:
      url: docker.io/supabase/storage-api:v1.11.13
    disk:
      name: arquivos
      mountPath: /var/lib/storage
      sizeGB: 5
    envVars:
      - key: ANON_KEY
        sync: false
      - key: SERVICE_KEY
        sync: false
      - key: PGRST_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false            # postgres://supabase_storage_admin:<SENHA>@<host do erp-db>:5432/postgres
      - key: POSTGREST_URL
        fromService:
          name: erp-rest
          type: pserv
          property: hostport
      - key: FILE_SIZE_LIMIT
        value: "52428800"
      - key: STORAGE_BACKEND
        value: file
      - key: FILE_STORAGE_BACKEND_PATH
        value: /var/lib/storage
      - key: TENANT_ID
        value: stub
      - key: REGION
        value: stub
      - key: GLOBAL_S3_BUCKET
        value: stub

  # --- Edge Functions -------------------------------------------------------
  # Imagem propria: as 59 funcoes e o config.toml entram nela (a Render nao
  # tem bind mount).
  - name: erp-functions
    type: pserv
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./infra/failover/render/Dockerfile.functions
    dockerContext: .
    autoDeploy: false
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false            # a URL publica do erp-kong
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      # A verificacao de JWT e feita POR FUNCAO pelo roteador, lendo o
      # config.toml. Um interruptor global aqui quebraria as 14 publicas.
      - key: VERIFY_JWT
        value: "false"

  # --- gateway (o unico publico) -------------------------------------------
  - name: erp-kong
    type: web
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./infra/failover/render/Dockerfile.kong
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /rest/v1/
    envVars:
      - key: KONG_DATABASE
        value: "off"
      - key: KONG_DECLARATIVE_CONFIG
        value: /home/kong/kong.yml
      - key: KONG_DNS_ORDER
        value: LAST,A,CNAME
      - key: KONG_PLUGINS
        value: request-transformer,cors,key-auth,acl
      - key: KONG_PROXY_LISTEN
        value: 0.0.0.0:8000
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Os destinos das rotas. A propria Render preenche com o endereco
      # interno de cada servico, entao nao ha endereco escrito a mao para
      # ficar desatualizado.
      - key: ALVO_AUTH
        fromService:
          name: erp-auth
          type: pserv
          property: hostport
      - key: ALVO_REST
        fromService:
          name: erp-rest
          type: pserv
          property: hostport
      - key: ALVO_STORAGE
        fromService:
          name: erp-storage
          type: pserv
          property: hostport
      - key: ALVO_FUNCTIONS
        fromService:
          name: erp-functions
          type: pserv
          property: hostport
