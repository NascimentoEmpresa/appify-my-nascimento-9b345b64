# ============================================================================
#  Replica de failover do ERP na Render  —  UM serviço só
# ============================================================================
#
#  POR QUE UM E NAO SETE
#  A primeira versao deste arquivo descrevia sete servicos, traduzindo o
#  docker-compose ao pe da letra. Sete containers e bom em PRODUCAO: cada peca
#  reinicia, escala e falha sozinha. Mas a replica NAO ATENDE NINGUEM ate a
#  Supabase cair - isolamento que ninguem usa, cobrado por mes, e desperdicio.
#
#      sete servicos separados ....... ~US$ 64/mes
#      uma imagem com tudo dentro .... ~US$ 27,50/mes
#
#  E ha um ganho que vale mais que o dinheiro: com uma imagem so, o que se
#  testa na maquina do dev e o que roda na Render passam a ser o MESMO
#  artefato, e nao dois parecidos.
#
#  O QUE SE PERDE: um processo que morre e reiniciado pelo supervisor, mas um
#  problema grave derruba tudo junto. Para um standby frio, troca aceitavel. Se
#  um dia a replica virar producao de verdade, vale voltar a separar.
#
#  O QUE RODA DENTRO (ver infra/failover/render/Dockerfile.monolito)
#      postgres 17   o banco, com as 1.445 policies de RLS
#      postgrest     a API que o ERP chama (e quem aplica a RLS)
#      gotrue        o login, com as senhas restauradas do backup
#      storage       os anexos
#      edge-runtime  as 59 Edge Functions
#      nginx         o gateway, unico processo exposto
#      recarga       mantem a replica atualizada (desligada por padrao)
#
#  COMO USAR
#      No painel da Render: New > Blueprint > este repositorio, branch main.
#      Ela le este arquivo e pede os segredos marcados com `sync: false`.
#      Rode antes: node infra/failover/gerar-chaves.mjs
#      As chaves precisam ser COERENTES entre si (anon e service_role sao
#      assinadas com o JWT_SECRET); gerar na mao, separado, nao funciona.
#
#  AUTO SYNC: recomendo DESLIGAR no painel. Ligado, todo push na main faz a
#  Render reimplantar - inclusive durante um incidente, que e justamente quando
#  ninguem quer surpresa.
#
#  REGIAO: virginia (US-East). A Render nao tem datacenter na America do Sul, e
#  virginia e a mais proxima do Brasil.
# ============================================================================
services:
  - name: erp-failover
    type: web
    runtime: docker
    # Standard (1 CPU / 2 GB) e o minimo com folga. Nao e escolha de conforto:
    # a instancia Micro da Supabase, com 1 GB, JA CAIU restaurando este mesmo
    # banco em 29/09/2026. E na Render nao existe nada entre 512 MB (US$ 7) e
    # 2 GB (US$ 25) - o salto e esse.
    plan: standard
    region: virginia
    dockerfilePath: ./infra/failover/render/Dockerfile.monolito
    dockerContext: .
    # Desligado de proposito: um push na main durante um incidente
    # reconstruiria a replica bem na hora em que ela precisa ficar parada.
    autoDeploy: false
    # O /saude responde sem tocar no banco, de proposito: um banco ocupado
    # restaurando nao pode fazer a Render achar que o servico morreu.
    healthCheckPath: /saude
    disk:
      name: dados
      # 20 GB desde 02/10/2026. Medido com o banco restaurado e os anexos ja
      # copiados para o backup:
      #     banco     3,9 GB
      #     anexos    4,7 GB  (8.556 arquivos na producao)
      #     --------------
      #     total     8,6 GB
      #
      # Em 10 GB isso daria 86% - e nao sobra so o que esta guardado: cinco
      # vezes por dia a recarga BAIXA o backup e DESCOMPACTA dentro deste mesmo
      # disco. Faltar espaco no meio de um restore nao da erro educado: o
      # Postgres para de aceitar escrita e pode corromper o que estava
      # gravando. A replica quebraria justamente por termos enchido o disco.
      #
      # Em 20 GB sao 43%, com folga para o banco crescer - que e o motivo
      # principal. 3,9 GB de banco em 10 GB apertaria sozinho em poucos meses,
      # mesmo sem anexo nenhum.
      #
      # Custo: US$ 0,25/GB/mes -> US$ 5,00 em vez de US$ 2,50. A Render cobra
      # proporcional por segundo, entao a diferenca entra no mes corrente.
      #
      # Os anexos ficam em /var/lib/postgresql/data/storage, DENTRO deste
      # disco. Ate 02/10 o Storage apontava para /var/lib/storage, no overlay
      # do container: todo arquivo enviado sumiria no deploy seguinte, sem erro
      # nenhum. Esse mesmo descuido ja custou 82 anexos de patrimonio em outro
      # servico da Render.
      mountPath: /var/lib/postgresql/data
      sizeGB: 20
    envVars:
      # --- os quatro segredos, do .env gerado por gerar-chaves.mjs ----------
      - key: POSTGRES_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANON_KEY
        sync: false
      - key: SERVICE_ROLE_KEY
        sync: false

      # --- enderecos --------------------------------------------------------
      # URL_PUBLICA e a propria URL deste servico na Render. Fica em branco na
      # criacao (ela so existe depois) e e preenchida no painel logo em
      # seguida: o GoTrue usa para montar os links que manda por e-mail.
      - key: URL_PUBLICA
        sync: false
      # Onde o ERP e servido hoje. O GoTrue recusa redirecionar para qualquer
      # endereco fora desta lista - se ficar errado, o login "funciona" e
      # devolve o usuario para lugar nenhum.
      - key: URL_SITE
        value: https://appify-my-nascimento.lovable.app

      # --- recarga automatica (desligada ate ter as credenciais) ------------
      # Ligar exige GITHUB_TOKEN e a chave GPG abaixo. Enquanto estiver "nao",
      # a replica tem a idade da ultima carga manual.
      - key: RECARGA_AUTOMATICA
        value: "nao"
      - key: GITHUB_REPO
        value: NascimentoEmpresa/appify-my-nascimento-9b345b64
      # ATENCAO: a chave privada de GPG abre TODOS os backups da empresa. Quem
      # tiver acesso a este servico tem acesso aos backups. O caminho para
      # reduzir isso (uma segunda chave, so da replica) esta descrito em
      # infra/failover/render/recarga-render.sh e ainda NAO foi feito.
      - key: GITHUB_TOKEN
        sync: false
      - key: GPG_PRIVATE_KEY_B64
        sync: false
      - key: GPG_PASSPHRASE
        sync: false
